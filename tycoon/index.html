<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>甜梦小铺</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F6EBD8'/%3E%3Cellipse cx='32' cy='46' rx='18' ry='4' fill='%23E3ECDD' stroke='%237E9C8A'/%3E%3Cpath d='M32 22c-5 0-9 4-9 9 0 4 4 7 9 7s9-3 9-7c0-5-4-9-9-9z' fill='%23F4D3C2' stroke='%23D28E7E'/%3E%3Ccircle cx='32' cy='31' r='3' fill='%23A63F51'/%3E%3C/svg%3E">
<style>html,body{margin:0;height:100%;background:#F6EBD8;color:#3E2D29;font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}#b{display:grid;place-items:center;height:100%}#bx{width:min(240px,66vw);text-align:center;letter-spacing:.08em}#bb{height:6px;border-radius:99px;background:#EADCC6;overflow:hidden;margin:12px 0 8px}#pg{display:block;height:100%;width:0;background:linear-gradient(90deg,#B24A58,#B98A3C);transition:width .25s ease}#st{font-size:11px;color:#8A7460;letter-spacing:.04em}</style>
</head><body><div id="b"><div id="bx"><div>甜梦小铺 · 载入中</div><div id="bb"><i id="pg"></i></div><div id="st">准备中</div></div></div>
<script>
(function(){
var F=["288449cff6.js", "5d40f7ae68.js"],N=2,INLINE="";
var BUILD="27a932e3c6610a6b",CK="tm_h5_"+BUILD;
function purge(){
  try{
    for(var i=localStorage.length-1;i>=0;i--){
      var k=localStorage.key(i);
      if(k && k.indexOf("tm_h5_")===0 && k!==CK) localStorage.removeItem(k);
    }
  }catch(e){}
}
function show(h){
  var b=document.getElementById("b"); if(b) b.style.display="none";
  document.title="甜梦小铺";
  /* 顶层文档直接渲染，避免 iframe 的 opaque origin 导致存档不持久 */
  document.open(); document.write(h); document.close();
}
var PG=document.getElementById("pg"),ST=document.getElementById("st");
function paint(p,t){
  if(PG) PG.style.width=Math.max(0,Math.min(100,p))+"%";
  if(ST) ST.textContent=t;
}
function fail(){
  /* 用查询参数强制取新 index，绕开旧缓存与已删除的分片；只自动重试一次 */
  if(!/[?&]retry=/.test(location.search)){
    var u=new URL(location.href);
    u.searchParams.set("retry","1");
    u.searchParams.set("t",Date.now());
    location.replace(u.toString());
    return;
  }
  paint(100,"载入失败，请刷新重试");
}
function boot(){
var cached=null;
try{
  var ch=localStorage.getItem(CK);
  if(ch && ch.length>10000 && ch.indexOf("<html")>=0) cached=ch;
}catch(e){}
if(cached){ paint(100,"本地缓存 · 秒开"); purge(); setTimeout(function(){show(cached);},60); return; }
var loaded=0,total=N||1;
function bump(){
  loaded++;
  paint(Math.min(92,Math.round(loaded/total*84)),"分片 "+loaded+"/"+total);
}
function unpack(){
  paint(94,"解密中");
  var t=INLINE || (window.__PC||[]).join("");
  var K="ufnlCMfwtE1O"+"EUv125OQ9JnECT7T"+"YrsVhXFtUvRBXps="+"",V="LphNcvUJzSLLRB7E";
  var b=atob(t),c=new Uint8Array(b.length);
  for(var j=0;j<b.length;j++)c[j]=b.charCodeAt(j);
  var v=new Uint8Array(atob(V).split("").map(function(x){return x.charCodeAt(0);}));
  var kk=new Uint8Array(atob(K).split("").map(function(x){return x.charCodeAt(0);}));
  return crypto.subtle.importKey("raw",kk,{name:"AES-GCM"},false,["decrypt"]).then(function(ky){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:v},ky,c);
  }).then(function(p){
    if (!("DecompressionStream" in window)) throw new Error("unsupported");
    var ds=new DecompressionStream("gzip"),w=ds.writable.getWriter();
    w.write(p); w.close();
    return new Response(ds.readable).arrayBuffer();
  }).then(function(buf){
    var h=new TextDecoder().decode(new Uint8Array(buf));
    try{
      purge();
      localStorage.setItem(CK,h);
    }catch(e){
      purge();
      try{ localStorage.setItem(CK,h); }catch(e3){}
    }
    paint(100,"启动中");
    show(h);
  });
}
function getChunk(src){
  var tries=0;
  return new Promise(function(res,rej){
    function go(){
      var ctl=new AbortController();
      var timer=setTimeout(function(){ try{ctl.abort();}catch(e){} },15000);
      fetch(src+"?b="+BUILD+"&n="+(tries+1),{cache:"no-store",signal:ctl.signal})
        .then(function(r){
          clearTimeout(timer);
          if(!r.ok) throw new Error("http "+r.status);
          return r.text();
        })
        .then(function(t){
          if(!t || t.indexOf("window.__PC")<0) throw new Error("chunk body");
          var sc=document.createElement("script"); sc.text=t; document.head.appendChild(sc); sc.remove();
          bump(); res();
        })
        .catch(function(e){
          clearTimeout(timer);
          tries++;
          if(tries<2) setTimeout(go,600);
          else rej(e);
        });
    }
    go();
  });
}
if(INLINE){
  unpack().catch(function(e){ if(console&&console.error) console.error(e); fail(); });
}else{
  paint(4,"正在获取分片");
  setTimeout(function(){ if(!loaded) paint(18,"网络较慢，继续等待…"); },6000);
  Promise.all(F.map(getChunk)).then(function(){ paint(90,"分片就绪"); return unpack(); }).catch(function(e){ if(console&&console.error) console.error(e); fail(); });
}
}
function checkVersion(){
  var U="tm_up_"+BUILD;
  try{ if(sessionStorage.getItem(U)){ boot(); return; } }catch(e){}
  var ctl=new AbortController();
  var tm=setTimeout(function(){ try{ctl.abort();}catch(e){} },5000);
  fetch("version.txt?t="+Date.now(),{cache:"no-store",signal:ctl.signal})
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(t){
      clearTimeout(tm);
      t=(t||"").trim();
      if(/^[0-9a-f]{16}$/.test(t) && t!==BUILD && !/[?&]u=/.test(location.search)){
        try{ sessionStorage.setItem(U,"1"); }catch(e){}
        var u=new URL(location.href);
        u.searchParams.set("u",Date.now());
        location.replace(u.toString());
        return;
      }
      boot();
    })
    .catch(function(){ clearTimeout(tm); boot(); });
}
checkVersion();
})();
</script></body></html>
