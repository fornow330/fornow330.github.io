  fetch("./version.txt?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";})["catch"](function(){return "";}).then(function(x){
    if(fin)return;fin=true;clearTimeout(to);
    var m=((x||"").trim().split("=").pop()||"").trim();
    if(!m||m===VR){go();return;}
    var seen="";try{seen=sessionStorage.getItem("tyv")||"";}catch(e){}
    try{sessionStorage.setItem("tyv",m);}catch(e){}
    if(seen===m){go();return;}          // 同一目标只跳一次，避免死循环
    try{var i,k;for(i=localStorage.length-1;i>=0;i--){k=localStorage.key(i);if(k&&k.indexOf("ty_")===0)localStorage.removeItem(k);}}catch(e){}
    try{location.replace(location.pathname+"?v="+encodeURIComponent(m));}catch(e){go();}
  });
}catch(e){go();}}
VC();})();</script>
