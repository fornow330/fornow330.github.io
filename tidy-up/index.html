      for (i = S.floats.length - 1; i >= 0; i--) {
        S.floats[i].t += dt;
        if (S.floats[i].t >= S.floats[i].dur) S.floats.splice(i, 1);
      }
      // 计时器
      for (i = S.timers.length - 1; i >= 0; i--) {
        S.timers[i].t -= dt;
        if (S.timers[i].t <= 0) {
          var fn = S.timers[i].fn;
          S.timers.splice(i, 1);
          fn();
        }
      }
      if (S.tapFx) { S.tapFx.t += dt; if (S.tapFx.t > 0.45) S.tapFx = null; }
      // 限时：倒计时归零判负
      if (S.screen === 'play' && S.mod && S.mod.timer && S.timeLeft > 0) {
        S.timeLeft -= dt;
        if (S.timeLeft <= 0) { S.timeLeft = 0; toast('时间到'); lose(); return; }
      }
      // 自动进槽：每隔 9 秒有一件自己滑进槽里
      if (S.screen === 'play' && S.mod && S.mod.drain && !S.busy) {
        S.drainT += dt;
        if (S.drainT >= 9) {
          S.drainT = 0;
          var freeOnes = [];
          for (var fi = 0; fi < S.items.length; fi++) if (!S.items[fi].blocked) freeOnes.push(S.items[fi]);
          if (freeOnes.length && S.slots.length + S.flying.length < effSlotMax()) {
            var fi2 = freeOnes[Math.floor(Math.random() * freeOnes.length)];
            toast('一件自己掉进槽里');
            pick(fi2);
          }
        }
      }
      // 起雾：每隔约 6 秒在桌面随机位置糊一块，遮 1.7 秒
      if (S.screen === 'play' && S.mod && S.mod.fog) {
        if (S.fog) {
          S.fog.t += dt;
          if (S.fog.t > 1.7) { S.fog = null; S.fogT = 0; }
        } else {
          S.fogT += dt;
          if (S.fogT >= 6) {
            S.fog = { x: Math.random() * (L.desk.w - 150) + 75, y: Math.random() * (L.desk.h - 150) + 75, r: 62, t: 0 };
          }
        }
      }
      if (S.toastT > 0) S.toastT -= dt;
      if (S.mod && S.mod.spin) S.spinA += dt * 0.14;
      if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.4);
      if (S.shakeCD > 0) S.shakeCD = Math.max(0, S.shakeCD - dt);
      if (S.shakeAnim > 0) S.shakeAnim = Math.max(0, S.shakeAnim - dt);

      if (landed) S.needCheck = true;
      if (S.needCheck && !S.busy) { S.needCheck = false; checkClear(); }
    }

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = COL.paper;
      ctx.fillRect(0, 0, W, H);

      if (S.screen === 'home') {
        drawHome();
      } else if (S.screen === 'levels') {
        drawLevels();
      } else {
        drawHud();
        drawModStrip();
        drawDesk();
        drawFog();
        drawSlots();
        drawTools();
        drawTapFx();
        drawEffects();
        if (S.screen === 'win' || S.screen === 'lose') drawModal(S.screen);
      }
    }

    function loop(ts) {
      if (!lastTs) lastTs = ts;
      var dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      update(dt);
      draw();
      A.raf(loop);
    }

    /* ---------- 输入 ---------- */
    function toggleSound() {
      S.sound = !S.sound;
      persist();
      if (S.sound) sfx('tap');
    }

    function onDown(x, y) {
      if (S.screen === 'home') {
        if (inRect(x, y, L.homePlay)) {
          if (S.maxLevel > LEVEL_TOTAL) { openLevels(); sfx('tap'); return; }
          var target = clamp(S.maxLevel, 1, LEVEL_TOTAL);
          if (target > 1) { S.score = 0; S.combo = 0; startLevel(target); }
          else { newRun(); }
          sfx('tap'); return;
        }
        if (inRect(x, y, L.homeLevels)) { openLevels(); sfx('tap'); return; }
        if (inRect(x, y, L.homeSound)) { toggleSound(); return; }
        if (inRect(x, y, L.homeShare)) { A.share(S.score, S.maxLevel); return; }
        return;
      }

      if (S.screen === 'levels') {
        if (inRect(x, y, L.back)) { S.screen = 'home'; sfx('tap'); return; }
        if (runCount() > 1) {
          if (inRect(x, y, L.runPrev) && S.run > 1) { switchRun(S.run - 1); sfx('tap'); return; }
          if (inRect(x, y, L.runNext) && S.run < runCount()) { switchRun(S.run + 1); sfx('tap'); return; }
        }
        if (inRect(x, y, L.pagePrev)) {
          if (S.page > 0) { S.page--; sfx('tap'); }
          return;
        }
        if (inRect(x, y, L.pageNext)) {
          if (S.page < L.lvPages - 1) { S.page++; sfx('tap'); }
          return;
        }
        for (var ci = 0; ci < L.cells.length; ci++) {
          var cell = L.cells[ci];
          if (cell.page !== (S.page || 0)) continue;
          if (!inRect(x, y, cell)) continue;
          if (cell.level <= S.maxLevel && cell.level <= LEVEL_TOTAL) {
            S.score = 0; S.combo = 0;
            startLevel(cell.level);
            sfx('tap');
          }
          return;
        }
        return;
      }

      if (S.screen === 'win' || S.screen === 'lose') {
        if (inRect(x, y, L.modalB1)) {
          if (S.screen === 'win') {
            if (S.level >= LEVEL_TOTAL) {
              // 本周目 100 关清空：有下周目就进下一周目第 1 关，否则回选关
              if (S.runMax[S.run + 1]) { switchRun(S.run + 1); startLevel(1); return; }
              openLevels(); return;
            }
            startLevel(S.level + 1);
          } else startLevel(S.level);
          return;
        }
        if (inRect(x, y, L.modalB2)) { openLevels(); return; }
        return;
      }

      // 点变体条上的 chip → 弹这个变体的简介
      for (var mc = 0; mc < (L.modChips || []).length; mc++) {
        var chap = L.modChips[mc];
        if (!inRect(x, y, chap)) continue;
        if (chap.key && MOD_DEFS[chap.key]) {
          toast(MOD_DEFS[chap.key].name + '：' + MOD_DEFS[chap.key].tip, 2.4);
        } else if (chap.more && chap.more.length) {
          var moreNames = [];
          for (var mn = 0; mn < chap.more.length; mn++) {
            var dd = MOD_DEFS[chap.more[mn]];
            moreNames.push(dd ? dd.name : chap.more[mn]);
          }
          toast('还有 ' + chap.more.length + ' 种：' + moreNames.join('、'), 2.8);
        }
        sfx('tap'); return;
      }
      if (inRect(x, y, L.soundBtn)) { toggleSound(); return; }
      for (var i = 0; i < L.tools.length; i++) {
        if (inRect(x, y, L.tools[i])) {
          var id = L.tools[i].id;
          if (id === 'undo') doUndo();
          else if (id === 'shuffle') doShuffle();
          else if (id === 'shake') doShake();
          else doRemove();
          return;
        }
      }
      // 暂放区里的物件点一下就拿回槽里
      for (var s2 = 0; s2 < S.shelf.length; s2++) {
        if (inRect(x, y, L.shelfChips[s2])) { takeFromShelf(s2); return; }
      }
      // 点暂放区面板的空白处不穿透到下面的桌面物件
      if (S.shelf.length && inRect(x, y, L.shelf)) return;
      // 反手：桌面区点击左右镜像，道具/槽位/暂放区照常
      if (S.mod && S.mod.mirrorTap && inRect(x, y, L.desk)) {
        x = L.desk.x + L.desk.w - (x - L.desk.x);
      }
      var it = topFreeAt(x, y);
      if (!it) it = nearestFree(x, y, L.tile * 1.05);
      if (it) tapItem(it);
    }

    /* ---------- 初始化 ---------- */
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    if (canvas.style) {
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
    }
    ctx.scale(dpr, dpr);

    layout();
    A.onPointer(onDown);
    if (A.onShake) A.onShake(function () { doShake(); });
    A.onResize(function () {
      dpr = Math.min(A.dpr || 1, 2.5);
      canvas.width = Math.floor(A.width * dpr);
      canvas.height = Math.floor(A.height * dpr);
      if (canvas.style) {
        canvas.style.width = A.width + 'px';
        canvas.style.height = A.height + 'px';
      }
      layout();
    });

    A.raf(loop);

    return {
      startLevel: startLevel,
      newRun: newRun,
      state: S,
      layout: layout,
      rects: L,
      shake: doShake,
      takeFromShelf: takeFromShelf,
      canClear: canClear,
      checkClear: checkClear,          // 自检用：手搭三连后主动触发判定
      openLevels: openLevels,
      switchRun: switchRun
    };
  }

  return { start: start, TYPES: TYPES, COL: COL };
});

</script>
<script>
/* 网页适配层：用 DOM Canvas + WebAudio + localStorage 顶替小游戏能力 */
(function (g) {
  function createWebAdapter(canvas, opts) {
    opts = opts || {};
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'game';
      document.body.appendChild(canvas);
    }
    function measure() {
      if (opts.getSize) return opts.getSize();
      if (canvas.parentNode && canvas.parentNode.clientWidth) {
        return { w: canvas.parentNode.clientWidth, h: canvas.parentNode.clientHeight };
      }
      return { w: window.innerWidth, h: window.innerHeight };
    }

    var pointerCb = null, resizeCb = null, shakeCb = null, lastShake = 0;
    var AC = null;
    var sz = measure();

    function ac() {
      if (!AC) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        AC = new C();
      }
      if (AC.state === 'suspended' && AC.resume) AC.resume();
      return AC;
    }

    function beep(freq, start, dur, type, vol) {
      var a = ac();
      if (!a) return;
      var o = a.createOscillator(), gn = a.createGain();
      o.type = type || 'triangle';
      o.frequency.value = freq;
      var t0 = a.currentTime + start;
      gn.gain.setValueAtTime(0.0001, t0);
      gn.gain.linearRampToValueAtTime(vol == null ? 0.16 : vol, t0 + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(gn); gn.connect(a.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }

    var api = {
      canvas: canvas,
      width: sz.w,
      height: sz.h,
      dpr: window.devicePixelRatio || 1,
      safeTop: 0,
      safeBottom: 0,
      raf: function (cb) { requestAnimationFrame(cb); },
      offscreen: function (w, h) {
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.floor(w));
        c.height = Math.max(1, Math.floor(h));
        return c;
      },
      onPointer: function (cb) { pointerCb = cb; },
      onShake: function (cb) {
        shakeCb = cb;
        // 网页端用 devicemotion 兜底：手机浏览器摇一摇能触发，桌面浏览器没有传感器则无感
        window.addEventListener('devicemotion', function (e) {
          if (!shakeCb) return;
          var acc = e.accelerationIncludingGravity || e.acceleration;
          if (!acc) return;
          var now = Date.now();
          if (now - lastShake < 900) return;
          var mag = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
          if (mag > 26) { lastShake = now; shakeCb(); }
        }, false);
      },
      onResize: function (cb) { resizeCb = cb; },
      storage: {
        load: function () {
          try { return JSON.parse(window.localStorage.getItem('sanyilian_save') || 'null'); }
          catch (e) { return null; }
        },
        save: function (obj) {
          try { window.localStorage.setItem('sanyilian_save', JSON.stringify(obj)); }
          catch (e) { /* 隐私模式忽略 */ }
        }
      },
      playSound: function (name) {
        if (name === 'pick') beep(560, 0, 0.09, 'triangle', 0.12);
        else if (name === 'tap') beep(440, 0, 0.08, 'sine', 0.1);
        else if (name === 'clear') { beep(660, 0, 0.12, 'triangle', 0.14); beep(880, 0.1, 0.16, 'triangle', 0.13); }
        else if (name === 'win') { beep(523, 0, 0.14); beep(659, 0.12, 0.14); beep(784, 0.24, 0.2); beep(1046, 0.38, 0.3); }
        else if (name === 'lose') { beep(180, 0, 0.2, 'sawtooth', 0.1); beep(120, 0.18, 0.28, 'sawtooth', 0.1); }
      },
      vibrate: function () { /* 网页不震动 */ },
      share: function (score, maxLevel) {
        var txt = '三连收纳：我收了 ' + score + ' 分，最远到第 ' + maxLevel + ' 关';
        if (navigator.share) { navigator.share({ title: '三连收纳', text: txt }).catch(function () { }); return; }
        if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function () { });
      },
      rewarded: function (done) {
        // 网页试玩版没有广告，直接放行，仅用于验证流程
        setTimeout(function () { done(true); }, 200);
      }
    };

    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (!pointerCb) return;
      var r = canvas.getBoundingClientRect();
      pointerCb(e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    window.addEventListener('resize', function () {
      var s = measure();
      api.width = s.w; api.height = s.h;
      if (resizeCb) resizeCb();
    });

    return api;
  }
  g.createWebAdapter = createWebAdapter;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function () {
  var frame = document.getElementById('frame');
  var boot = document.getElementById('boot');
  var canvas = document.createElement('canvas');
  canvas.style.position = 'absolute';
  canvas.style.left = '0';
  canvas.style.top = '0';
  frame.appendChild(canvas);
  if (boot && boot.parentNode) boot.parentNode.removeChild(boot);

  var adapter = createWebAdapter(canvas, {
    getSize: function () {
      return {
        w: Math.min(460, frame.clientWidth || window.innerWidth),
        h: frame.clientHeight || window.innerHeight
      };
    }
  });
  window.game = TripleSort.start(adapter);
})();
</script>
