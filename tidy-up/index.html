<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三连收纳 · 试玩版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FFFCF4' stroke='%23221F1A' stroke-width='2'/%3E%3Ccircle cx='12' cy='14' r='5' fill='%23E8615A'/%3E%3Cpath d='M22 10 L27 16 L22 22 L17 16Z' fill='%232FA88A'/%3E%3C/svg%3E">
<style>
  html, body {margin:0; padding:0; height:100%; background:#EFE8DC; overflow:hidden;}
  body {display:flex; align-items:center; justify-content:center;
        font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
        -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;}
  #stage {position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center;}
  #stage canvas {display:block; touch-action:none; border-radius:0;}
  #frame {position:relative; box-shadow:0 0 0 1px rgba(34,31,26,.10), 0 18px 44px rgba(34,31,26,.16);
          border-radius:22px; overflow:hidden; background:#EFE8DC;}
  #boot {position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
         color:#8C8271; font-size:13px; letter-spacing:.08em; background:#EFE8DC;}
  @media (min-width: 620px) {
    #frame {width:414px; height:min(736px, 96vh);}
  }
  @media (max-width: 619px) {
    #frame {width:100vw; height:100vh; border-radius:0; box-shadow:none;}
  }
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="boot">载入中</div></div></div>
<script>
/* 三连收纳 · 游戏引擎（与平台无关）
 * 网页 / 微信小游戏 / 抖音小游戏共用同一份逻辑，平台差异全部收在 adapter 里。
 * 用法： var game = TripleSort.start(adapter);
 */
(function (g, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) { module.exports = api; }
  else { g.TripleSort = api; }
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var COL = {
    paper: '#EFE8DC', ink: '#221F1A', panel: '#FFFCF4', muted: '#8C8271',
    line: '#C9BFAC', slot: '#F7F1E5', dot: '#DED4C1', soft: '#FBF6EC'
  };
  var FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

  var TYPES = [
    { k: 'dot', c: '#E8615A' },
    { k: 'tri', c: '#E39B2F' },
    { k: 'dia', c: '#2FA88A' },
    { k: 'star', c: '#3F7CC4' },
    { k: 'hex', c: '#8367C7' },
    { k: 'heart', c: '#D9568A' },
    { k: 'moon', c: '#6DA84F' },
    { k: 'flower', c: '#C7793F' }
  ];

  var SLOT_MAX = 7;
  var CLUSTER_SIZE = 3;     // 每堆约 3 件
  var CLUSTER_JITTER = 1.35; // 堆内抖动半径（以格为单位）
  var SHUFFLE_WIN = 8;      // 三连局部打乱窗口

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ri(n) { return Math.floor(Math.random() * n); }

  function rr(ctx, x, y, w, h, r) {
    var rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  var COLOR_MAP = null;   // 同色异形：某些形状临时改色

  var CUR_MOD = {};       // 当前关变体开关（模块级，供生成/绘制读取）

  function colorOf(key) {
    if (COLOR_MAP && COLOR_MAP[key]) return COLOR_MAP[key];
    for (var i = 0; i < TYPES.length; i++) if (TYPES[i].k === key) return TYPES[i].c;
    return '#000';
  }

  /* ================= 图形符号 ================= */
  function drawGlyph(ctx, type, cx, cy, s, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;
    var r = s / 2;
    var i, a, px, py;
    if (type === 'dot') {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    } else if (type === 'tri') {
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r * 0.93, r * 0.78); ctx.lineTo(-r * 0.93, r * 0.78);
      ctx.closePath(); ctx.fill();
    } else if (type === 'dia') {
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0);
      ctx.closePath(); ctx.fill();
    } else if (type === 'star') {
      ctx.beginPath();
      for (i = 0; i < 5; i++) {
        a = -Math.PI / 2 + i * Math.PI * 2 / 5;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        ctx.lineTo(Math.cos(a + Math.PI / 5) * r * 0.42, Math.sin(a + Math.PI / 5) * r * 0.42);
      }
      ctx.closePath(); ctx.fill();
    } else if (type === 'hex') {
      ctx.beginPath();
      for (i = 0; i < 6; i++) {
        a = -Math.PI / 2 + i * Math.PI / 3;
        px = Math.cos(a) * r; py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    } else if (type === 'heart') {
      ctx.beginPath();
      ctx.moveTo(0, r * 0.92);
      ctx.bezierCurveTo(-r * 1.25, r * 0.2, -r * 0.72, -r * 1.1, 0, -r * 0.36);
      ctx.bezierCurveTo(r * 0.72, -r * 1.1, r * 1.25, r * 0.2, 0, r * 0.92);
      ctx.closePath(); ctx.fill();
    } else if (type === 'moon') {
      ctx.beginPath();
      ctx.arc(0, 0, r, Math.PI * 0.32, Math.PI * 1.68, false);
      ctx.arc(r * 0.42, 0, r * 0.78, Math.PI * 1.62, Math.PI * 0.38, true);
      ctx.closePath(); ctx.fill();
    } else if (type === 'flower') {
      for (i = 0; i < 4; i++) {
        a = i * Math.PI / 2;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52, r * 0.46, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  /* ================= 关卡生成 ================= */
  var LEVEL_TOTAL = 100;    // 选关页一共 100 关
  var SIZE_MIN = 0.78;      // 物件大小随机系数下限
  var SIZE_MAX = 1.18;

  /* ================= 关卡变体（每关一个新花样） =================
   * 1~4 关保持纯净教学；5~24 关每关抽 1 个；25 关起抽 2 个（互斥的组合不会同时出现）。
   * 抽签用关卡号做种子，同一关每次进入变体一致，重玩不会变脸。
   */
  var MOD_DEFS = {
    veil:       { name: '蒙布',   tip: '盖布的物件先揭布' },
    glue:       { name: '胶粘',   tip: '粘住的要点两下' },
    fewSlots:   { name: '少一格', tip: '槽位少一个' },
    sameColour: { name: '同色异形', tip: '只认形状，不认颜色' },
    bigRange:   { name: '大小悬殊', tip: '大小差得更夸张' },
    tilt:       { name: '斜着放', tip: '物件摆得更歪' },
    noTool:     { name: '道具荒', tip: '本关没有道具' },
    lockSlot:   { name: '占位杂物', tip: '槽里先卡着杂物' },
    ice:        { name: '冰封',   tip: '冰壳要敲一下' },
    refill:     { name: '分批上桌', tip: '物件分批补上来' },
    grey:       { name: '灰模',   tip: '没有颜色，只认形状' },
    mirror:     { name: '镜像',   tip: '形状左右翻过来了' },
    lockCell:   { name: '锁格',   tip: '槽位锁两格，消一组开一格' },
    moveOnClear:{ name: '挪窝',   tip: '每消一组，桌面重新洗位置' },
    timer:      { name: '限时',   tip: '本关限时 150 秒' },
    limitedTaps:{ name: '限步',   tip: '点选次数有上限' },
    blind:      { name: '盲盒',   tip: '有几件完全看不见' },
    drain:      { name: '自动进槽', tip: '每隔几秒有件自己滑进槽' },
    mirrorSlots:{ name: '反向槽', tip: '槽位从右往左填' },
    decoys:     { name: '空心件', tip: '混着几件空心的，点了会消失' },
    orderPick:  { name: '按序取',  tip: '只能先拿最上面那件' },
    tiny:       { name: '米粒件', tip: '有几件小得像米粒' },
    dock1:      { name: '暂放一格', tip: '暂放区只剩 1 格' },
    fog:        { name: '起雾',   tip: '桌面会突然起雾挡住一块' },
    slowSlot:   { name: '慢槽',   tip: '芯片飞得慢，落定才算数' },
    darkSlot:   { name: '暗槽',   tip: '槽里的芯片看不清' },
    junk2:      { name: '双杂物', tip: '槽里先卡两件杂物' },
    upside:     { name: '倒画',   tip: '图形上下翻转' },
    slip:       { name: '溜手',   tip: '有件会滑回桌面' },
    blindSlots: { name: '盲槽',   tip: '槽里的芯片只显示问号' },
    mirrorTap:  { name: '反手',   tip: '点的位置左右镜像，反着来' },
    toolCost:   { name: '双耗',   tip: '每个道具用一次扣两次' },
    shrink:     { name: '渐缩',   tip: '每消一组，全桌再小一圈' },
    slotShuffle:{ name: '洗槽',   tip: '每消一组，槽里的芯片重排' },
    darkDesk:   { name: '暗桌',   tip: '桌面调暗，物件对比拉低' },
    spin:       { name: '自转',   tip: '物件一直在慢慢转' }
  };
  var MOD_KEYS = ['veil', 'glue', 'fewSlots', 'sameColour', 'bigRange', 'tilt', 'noTool', 'lockSlot', 'ice', 'refill', 'grey', 'mirror', 'lockCell', 'moveOnClear', 'timer', 'limitedTaps', 'blind', 'drain', 'mirrorSlots', 'decoys', 'orderPick', 'tiny', 'dock1', 'fog', 'slowSlot', 'darkSlot', 'junk2', 'upside', 'slip', 'blindSlots', 'mirrorTap', 'toolCost', 'shrink', 'slotShuffle', 'darkDesk', 'spin'];
  var MOD_CONFLICT = {
    fewSlots: ['lockSlot', 'lockCell', 'drain'], lockSlot: ['fewSlots', 'lockCell', 'drain'],
    ice: ['refill', 'glue'], refill: ['ice'], glue: ['ice'],
    lockCell: ['fewSlots', 'lockSlot', 'drain', 'mirrorSlots'], drain: ['fewSlots', 'lockSlot', 'lockCell'],
    grey: ['sameColour'], sameColour: ['grey'],
    mirrorSlots: ['lockCell'], blind: ['veil'], veil: ['blind'],
    timer: ['limitedTaps'], limitedTaps: ['timer'],
    decoys: ['blind', 'veil'], blind: ['veil', 'decoys'], veil: ['blind', 'decoys'],
    orderPick: ['drain'], drain: ['fewSlots', 'lockSlot', 'lockCell', 'orderPick'],
    tiny: ['bigRange'], bigRange: ['tiny'],
    dock1: ['noTool'], noTool: ['dock1'],
    fog: [],
    slowSlot: ['timer'], timer: ['limitedTaps', 'slowSlot'],
    darkSlot: ['blindSlots'], blindSlots: ['darkSlot'],
    junk2: ['lockSlot', 'fewSlots', 'lockCell', 'drain'], lockSlot: ['fewSlots', 'lockCell', 'drain', 'junk2'],
    upside: ['mirror'], mirror: ['upside'],
    slip: ['limitedTaps'], limitedTaps: ['timer', 'slip'],
    mirrorTap: [], toolCost: ['noTool'], noTool: ['dock1', 'toolCost'],
    shrink: ['tiny'], tiny: ['bigRange', 'shrink'],
    slotShuffle: ['mirrorSlots', 'lockCell'], mirrorSlots: ['lockCell', 'slotShuffle'],
    darkDesk: ['grey'], grey: ['sameColour', 'darkDesk'],
    spin: ['tilt'], tilt: ['spin']
  };
  // 惩罚型变体（HEAVY）不叠惩罚型，否则后期直接打不动
  // 惩罚型登记：不再限制一关只能出现一个，但要按个数给补偿（少物件、多道具）
  var MOD_HEAVY = {
    fewSlots: 1, lockSlot: 1, ice: 1, noTool: 1, lockCell: 1, timer: 1, limitedTaps: 1, drain: 1,
    orderPick: 1, junk2: 1, mirrorTap: 1, toolCost: 1, slotShuffle: 1
  };

  function heavyCount(mods) {
    var n = 0;
    for (var i = 0; i < mods.length; i++) if (MOD_HEAVY[mods[i]]) n++;
    return n;
  }

  function modsConflict(a, b) {
    if (!a || !b || a === b) return true;
    var ca = MOD_CONFLICT[a] || [], cb = MOD_CONFLICT[b] || [];
    return ca.indexOf(b) >= 0 || cb.indexOf(a) >= 0;
  }

  // 本关叠加几个变体：5~24 一个，25~49 两个，50~74 三个，75~100 四个
  function modsPerLevel(level, run) {
    var base;
    if (level <= 4) base = 0;
    else if (level < 25) base = 1;
    else if (level < 50) base = 2;
    else if (level < 75) base = 3;
    else base = 4;
    // 二周目起每关再 +1，三周目 +2，依此类推
    // 周目越深越叠，没有硬上限；实际能抽到几个由变体总数与互斥/惩罚型规则决定
    return base + Math.max(0, (run || 1) - 1);
  }

  // 每次进关现场抽签：同一关重开也会换花样
  function rollMods(level, avoid, run) {
    var need = modsPerLevel(level, run);
    if (!need) return [];
    var best = null;
    for (var attempt = 0; attempt < 6; attempt++) {
      var out = [], ok = true, tries, i, j, bad, picked, cand;
      for (i = 0; i < need; i++) {
        picked = '';
        for (tries = 0; tries < 40; tries++) {
          cand = MOD_KEYS[Math.floor(Math.random() * MOD_KEYS.length)];
          if (out.indexOf(cand) >= 0) continue;              // 不重复
          bad = false;
          for (j = 0; j < out.length; j++) if (modsConflict(out[j], cand)) bad = true;
          if (bad) continue;
          // 惩罚型不再限一个，允许叠加
          picked = cand; break;
        }
        if (!picked) { ok = false; break; }
        out.push(picked);
      }
      if (!ok) { if (out.length > (best ? best.length : 0)) best = out.slice(); continue; }
      if (!avoid || out.join('+') !== avoid.join('+')) return out;
    }
    // 需求超过可用组合时（高周目），拿走能凑到的全部
    if (best && best.length) return best;
    return [MOD_KEYS[Math.floor(Math.random() * MOD_KEYS.length)]];
  }

  function makeItems(level) {
    var groupCount = Math.min(3 + level, 12);
    // 少一格、道具荒靠减少总量来补偿，机制有摩擦，别叠成劝退
    if (activeMod('fewSlots')) groupCount = Math.max(3, groupCount - 2);
    else if (activeMod('noTool') || activeMod('junk2')) groupCount = Math.max(3, groupCount - 1);
    // 叠到四个变体时整盘再少一组，否则后期纯劝退（CUR_MOD 是模块级，能读到本关变体数）
    if (CUR_MOD && CUR_MOD.__count >= 4) groupCount = Math.max(3, groupCount - 1);
    // 惩罚型放开后不再按重型个数减组：物件少=更容易，减多了会把深周目的难度抹平
    var typeCount = Math.min(TYPES.length, 3 + Math.floor(level / 3));
    var pool = TYPES.slice(0, typeCount);
    var keys = [];
    for (var i = 0; i < groupCount; i++) {
      var t = i < typeCount ? pool[i] : pool[ri(pool.length)];
      keys.push(t.k, t.k, t.k);
    }
    // 局部窗口打乱：三连大致落在堆叠顺序附近，又不至于机械可预测
    for (var s = 0; s < keys.length; s++) {
      var j = Math.min(keys.length - 1, s + ri(SHUFFLE_WIN));
      var tmp = keys[s]; keys[s] = keys[j]; keys[j] = tmp;
    }
    var items = [];
    for (var n = 0; n < keys.length; n++) {
      // 每件大小随机：视觉上更像真的收纳，也让遮挡关系不那么规整
      var sz = sizeRange(), rv = Math.random();
      var flags = {};
      if (activeMod('veil') && rv < 0.34) flags.veil = true;
      else if (activeMod('glue') && rv < 0.62) flags.glue = true;
      else if (activeMod('ice') && rv < 0.80) flags.ice = true;
      items.push({
        key: keys[n], z: n, rot: 0, cx: 0.5, cy: 0.5, jx: 0, jy: 0, x: 0, y: 0,
        s: Math.round(rnd(sz[0], sz[1]) * 100) / 100,
        veil: !!flags.veil, glue: !!flags.glue, ice: !!flags.ice,
        blocked: false
      });
    }
    scatter(items, tightnessOf(level));
    return items;
  }

  function sizeRange() {
    return activeMod('bigRange') ? [0.65, 1.30] : [SIZE_MIN, SIZE_MAX];
  }

  function activeMod(k) {
    return !!(CUR_MOD && CUR_MOD[k]);
  }

  function tightnessOf(level) {
    // 12 关之后物件堆得更紧；带变体的关再放松一点，抵消机制摩擦
    var base = level <= 12 ? 1 : Math.max(0.68, 1 - (level - 12) * 0.03);
    if (activeMod('veil') || activeMod('glue') || activeMod('ice') || activeMod('lockSlot')) base = Math.min(1, base + 0.05);
    return base;
  }

  function scatter(items, tight) {
    var tk = tight == null ? 1 : tight;
    var clusters = Math.max(3, Math.round(items.length / CLUSTER_SIZE));
    var centers = [];
    // 簇中心先按 2 列网格铺开，再轻微抖动，避免整桌物件挤在一条斜带上
    var rows = Math.ceil(clusters / 2);
    var cells = [];
    for (var r = 0; r < rows; r++) {
      for (var col = 0; col < 2; col++) cells.push({ cx: (col + 0.5) / 2, cy: (r + 0.5) / rows });
    }
    for (var sh = cells.length - 1; sh > 0; sh--) {
      var jj = Math.floor(Math.random() * (sh + 1));
      var tt = cells[sh]; cells[sh] = cells[jj]; cells[jj] = tt;
    }
    for (var c = 0; c < clusters; c++) {
      centers.push({
        cx: clamp(cells[c].cx + rnd(-0.1, 0.1), 0.14, 0.86),
        cy: clamp(cells[c].cy + rnd(-0.08, 0.08), 0.12, 0.88)
      });
    }
    for (var i = 0; i < items.length; i++) {
      var ct = centers[i % clusters];
      var ang = rnd(0, Math.PI * 2);
      var rad = Math.sqrt(Math.random()) * CLUSTER_JITTER;
      items[i].cx = ct.cx;
      items[i].cy = ct.cy;
      items[i].jx = Math.cos(ang) * rad;
      items[i].jy = Math.sin(ang) * rad * 0.95;
      items[i].rot = Math.round(activeMod('tilt') ? rnd(-30, 30) : rnd(-13, 13));
      items[i].z = i;
    }
  }

  /* ================= 可解性验证 =================
   * 参考同类型商业做法：关卡先由一个求解器跑通，再交给玩家，避免“这关根本过不去”。
   * 求解器用贪心 + 有限回溯：优先收口已攒了两件的类型，其次消化槽里已有的，
   * 再其次挑场上同款多的类型；同类型里挑压得最实（z 最大）的那件，移走后解锁最多。
   */
  var SOLVE_NODE_LIMIT = 3200;

  function freeIndices(rem, ts) {
    var out = [], a, b;
    for (a = 0; a < rem.length; a++) {
      var it = rem[a], sa = ts * (it.s || 1), area = sa * sa, cov = 0;
      for (b = 0; b < rem.length; b++) {
        var o = rem[b];
        if (b === a || o.z <= it.z) continue;
        var sb = ts * (o.s || 1);
        var dx = Math.min(it.x + sa, o.x + sb) - Math.max(it.x, o.x);
        var dy = Math.min(it.y + sa, o.y + sb) - Math.max(it.y, o.y);
        if (dx > 0 && dy > 0) cov += dx * dy;
      }
      if (cov / area <= 0.3) out.push(a);
    }
    return out;
  }

  function canClear(items, ts, capacity) {
    if (!items.length) return true;
    var cap = capacity || SLOT_MAX;
    var sim = [], i;
    for (i = 0; i < items.length; i++) {
      sim.push({ id: i, k: items[i].key, z: items[i].z, x: items[i].x, y: items[i].y, s: items[i].s || 1 });
    }
    var failed = {}, nodes = 0, aborted = false;

    function stateKey(rem, sc) {
      var ids = [], keys = [], t;
      for (var q = 0; q < rem.length; q++) ids.push(rem[q].id);
      for (t in sc) if (sc[t]) keys.push(t + ':' + sc[t]);
      return ids.join(',') + '|' + keys.join(',');
    }

    function rec(rem, sc, total) {
      if (!rem.length) return total === 0;
      if (++nodes > SOLVE_NODE_LIMIT) { aborted = true; return false; }
      var kk = stateKey(rem, sc);
      if (failed[kk]) return false;
      var free = freeIndices(rem, ts);
      if (!free.length) { failed[kk] = 1; return false; }

      var groups = {}, t, f;
      for (f = 0; f < free.length; f++) {
        var idx = free[f], key = rem[idx].k;
        var gp = groups[key];
        if (!gp) { gp = groups[key] = { n: 0, best: idx }; }
        gp.n++;
        if (rem[idx].z > rem[gp.best].z) gp.best = idx;
      }
      var cands = [];
      for (t in groups) {
        var have = sc[t] || 0, p;
        if (have === 2) p = 0;
        else if (total >= 6 && have >= 1) p = 0.5;
        else if (groups[t].n >= 3) p = 1;
        else if (have >= 1) p = 1.5;
        else p = 2;
        cands.push({ t: t, p: p, n: groups[t].n, best: groups[t].best });
      }
      cands.sort(function (x, y) { return x.p - y.p || y.n - x.n; });

      var top = Math.min(3, cands.length), c;
      for (c = 0; c < top; c++) {
        var cand = cands[c];
        if (total + 1 > cap) continue;
        var nsc = {}, q;
        for (q in sc) nsc[q] = sc[q];
        var cnt = (nsc[cand.t] || 0) + 1, ntotal = total + 1;
        if (cnt >= 3) { nsc[cand.t] = cnt - 3; ntotal -= 3; }
        else { nsc[cand.t] = cnt; }
        var nrem = rem.slice();
        nrem.splice(cand.best, 1);
        if (rec(nrem, nsc, ntotal)) return true;
        if (aborted) return false;
      }
      failed[kk] = 1;
      return false;
    }

    var ok = rec(sim, {}, 0);
    if (aborted) return true;   // 搜索超限按“可解”放行，宁可放过也不误杀关卡
    return ok;
  }

  /* ================= 主逻辑 ================= */
  function start(A) {
    var slotSeq = 0;
    var canvas = A.canvas;
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(A.dpr || 1, 2.5);
    var W = A.width, H = A.height;
    var L = {};
    var bgLayer = null;
    var lastTs = 0;

    var S = {
      screen: 'home', level: 1, score: 0, best: 0, maxLevel: 1,
      run: 1, runMax: { 1: 1 },
      items: [], slots: [], shelf: [], flying: [], floats: [], parts: [], timers: [],
      undoLeft: 1, shuffleLeft: 1, removeLeft: 1, refillLeft: 2,
      shakeLeft: 3, shakeCD: 0, shakeAnim: 0,
      combo: 0, lastClear: 0, busy: false, hint: true,
      sound: true, vibrate: true, flash: 0, toast: '', toastT: 0, needCheck: false,
      tries: 1
    };

    // 当前可用槽位数（槽位总数减去还被锁着的格子）
    function effSlotMax() {
      // 变体叠到 6 个以上时多给一格：再多惩罚型一起上也还有喘息空间
      var boost = (S.mods && S.mods.length >= 8) ? 1 : 0;
      return Math.max(3, (S.slotMax || SLOT_MAX) - (S.lockCells || 0) + boost);
    }

    var save = A.storage.load();
    if (save) {
      S.best = save.best || 0;
      S.maxLevel = save.maxLevel || 1;
      S.sound = save.sound !== false;
      S.vibrate = save.vibrate !== false;
      // 老存档只有单个 maxLevel，迁移成第 1 周目的进度
      S.runMax = save.runMax || { 1: save.maxLevel || 1 };
      if (!S.runMax[1]) S.runMax[1] = save.maxLevel || 1;
      S.run = save.run && S.runMax[save.run] ? save.run : 1;
      S.maxLevel = S.runMax[S.run];
    }
    function persist() {
      A.storage.save({ best: S.best, maxLevel: S.maxLevel, run: S.run, runMax: S.runMax, sound: S.sound, vibrate: S.vibrate });
    }
    function sfx(name) { if (S.sound) A.playSound(name); }
    function buzz(kind) { if (S.vibrate) A.vibrate(kind); }

    /* ---------- 布局 ---------- */
    function layout() {
      W = A.width; H = A.height;
      var pad = clamp(W * 0.035, 12, 18);
      var topSafe = A.safeTop || 0;
      var botSafe = A.safeBottom || 0;
      L.pad = pad;
      L.hudY = topSafe + 10;
      L.hudH = 44;
      L.lvPill = { x: pad, y: L.hudY, w: 64, h: L.hudH };
      L.scorePill = { x: pad + 72, y: L.hudY, w: 92, h: L.hudH };
      L.soundBtn = { x: W - pad - 40, y: L.hudY, w: 40, h: 40 };
      L.statPill = { x: L.scorePill.x + L.scorePill.w + 8, y: L.hudY, w: L.soundBtn.x - 8 - (L.scorePill.x + L.scorePill.w + 8), h: L.hudH };

      var slotIn = 8, slotGap = 6;
      var slotN = S.slotMax || SLOT_MAX;
      L.slotSize = Math.min(52, (W - pad * 2 - slotIn * 2 - slotGap * (slotN - 1)) / slotN);
      L.slotGap = slotGap;
      L.slotIn = slotIn;
      L.slotBar = { x: pad, w: W - pad * 2, h: L.slotSize + slotIn * 2 };
      L.toolH = 44;
      L.slotBar.y = H - botSafe - 12 - L.toolH - 10 - L.slotBar.h;
      L.toolsY = H - botSafe - 12 - L.toolH;

      // 变体条：本关有新花样时占一行，把桌面往下让
      L.modH = (S.mods && S.mods.length) ? 20 : 0;
      L.modStrip = { x: pad, y: L.hudY + L.hudH + 4, w: W - pad * 2, h: L.modH };
      var deskTop = L.hudY + L.hudH + 10 + L.modH;
      L.desk = { x: pad, y: deskTop, w: W - pad * 2, h: L.slotBar.y - 10 - deskTop };
      L.tile = clamp(L.desk.w * 0.168, 38, 66);

      var tgap = 6;
      var tw = (W - pad * 2 - tgap * 3) / 4;
      L.tools = [
        { x: pad, y: L.toolsY, w: tw, h: L.toolH, id: 'undo', label: '撤销' },
        { x: pad + tw + tgap, y: L.toolsY, w: tw, h: L.toolH, id: 'shuffle', label: '洗牌' },
        { x: pad + (tw + tgap) * 2, y: L.toolsY, w: tw, h: L.toolH, id: 'remove', label: '移出' },
        { x: pad + (tw + tgap) * 3, y: L.toolsY, w: tw, h: L.toolH, id: 'shake', label: '抖一抖' }
      ];

      // 暂放区（移出的物件放这儿，还能再拿回来）
      var sgap = 5;
      var ssize = clamp(L.desk.w * 0.078, 22, 34);
      L.shelfSize = ssize;
      var shH = ssize + 10;
      L.shelf = {
        x: L.desk.x + L.desk.w - (ssize * 3 + sgap * 2 + 18),
        y: L.desk.y + L.desk.h - shH - 8,
        w: ssize * 3 + sgap * 2 + 18,
        h: shH
      };
      L.shelfChips = [];
      for (var sc2 = 0; sc2 < 3; sc2++) {
        L.shelfChips.push({
          x: L.shelf.x + 9 + sc2 * (ssize + sgap),
          y: L.shelf.y + 5, w: ssize, h: ssize
        });
      }

      L.homePlay = { x: W / 2 - 104, y: 0, w: 208, h: 56 };
      L.homePlay.y = H * 0.635;
      L.homeLevels = { x: W / 2 - 74, y: L.homePlay.y + 68, w: 148, h: 36 };
      L.homeSound = { x: pad, y: H - botSafe - 56, w: 46, h: 46 };
      L.homeShare = { x: W - pad - 46, y: H - botSafe - 56, w: 46, h: 46 };
      L.previewY = H * 0.845;

      // 选关页：5 列 × 6 行 = 每页 30 关，100 关分 4 页
      L.back = { x: pad, y: L.hudY, w: 40, h: 40 };
      var cols = 5, gGap = 8, rowsPerPage = 6;
      L.lvPerPage = cols * rowsPerPage;
      L.lvPages = Math.ceil(LEVEL_TOTAL / L.lvPerPage);
      var cw = (W - pad * 2 - gGap * (cols - 1)) / cols;
      var gridH = rowsPerPage * cw + (rowsPerPage - 1) * gGap;
      L.runPrev = { x: W / 2 - 78, y: L.hudY + 30, w: 30, h: 24 };
      L.runNext = { x: W / 2 + 48, y: L.hudY + 30, w: 30, h: 24 };
      var gTop = L.hudY + 82, gBottom = H - botSafe - 96;
      // 网格在剩余区域里垂直居中，避免底部拖出一大片空白
      var gY = gTop + Math.max(0, (gBottom - gTop - gridH) / 2);
      L.grid = { x: pad, y: gY, cols: cols, cellW: cw, cellH: cw, gap: gGap, rowsPerPage: rowsPerPage };
      L.cells = [];
      for (var lv = 1; lv <= LEVEL_TOTAL; lv++) {
        var ci = lv - 1;
        var pg = Math.floor(ci / L.lvPerPage), onPg = ci % L.lvPerPage;
        var cr = Math.floor(onPg / cols), cc = onPg % cols;
        // 每页不满 30 关时（最后一页只有 10 关）让整页垂直居中，别在顶部挤一坨
        var countOnPg = Math.min(L.lvPerPage, LEVEL_TOTAL - pg * L.lvPerPage);
        var usedRows = Math.ceil(countOnPg / cols);
        var usedH = usedRows * cw + (usedRows - 1) * gGap;
        var dy = Math.max(0, (gridH - usedH) / 2);
        L.cells.push({
          level: lv, page: pg,
          x: L.grid.x + cc * (cw + gGap),
          y: L.grid.y + dy + cr * (cw + gGap),
          w: cw, h: cw
        });
      }
      L.pagePrev = { x: W / 2 - 112, y: H - botSafe - 58, w: 58, h: 34 };
      L.pageNext = { x: W / 2 + 54, y: H - botSafe - 58, w: 58, h: 34 };
      L.pageInfoY = H - botSafe - 40;
      L.legendY = H - botSafe - 80;

      var mw = Math.min(312, W - 40);
      L.modalW = mw;
      L.modalX = (W - mw) / 2;
      L.modalB1 = { x: L.modalX + 18, y: 0, w: mw - 36, h: 48 };
      L.modalB2 = { x: L.modalX + 18, y: 0, w: mw - 36, h: 40 };

      buildBg();
      placeAll();
    }

    function buildBg() {
      var cw = Math.floor(L.desk.w), ch = Math.floor(L.desk.h);
      if (cw <= 0 || ch <= 0) { bgLayer = null; return; }
      var cv = A.offscreen(cw, ch);
      var c2 = cv.getContext('2d');
      c2.fillStyle = COL.panel;
      c2.fillRect(0, 0, cw, ch);
      c2.fillStyle = COL.dot;
      for (var y = 10; y < ch; y += 18) {
        for (var x = 10; x < cw; x += 18) {
          c2.beginPath(); c2.arc(x, y, 1.1, 0, Math.PI * 2); c2.fill();
        }
      }
      bgLayer = cv;
    }

    /* ---------- 物件坐标与遮挡 ---------- */
    function placeAll() {
      for (var i = 0; i < S.items.length; i++) {
        var it = S.items[i];
        var ts = L.tile * (it.s || 1);
        var maxX = Math.max(0, L.desk.w - ts);
        var maxY = Math.max(0, L.desk.h - ts);
        var padT = Math.min(ts * 0.14, maxX / 2, maxY / 2);
        it.x = clamp(it.cx * maxX + it.jx * L.tile, padT, maxX - padT);
        it.y = clamp(it.cy * maxY + it.jy * L.tile, padT, maxY - padT);
      }
      refreshBlocked();
    }

    function refreshBlocked() {
      for (var i = 0; i < S.items.length; i++) {
        var a = S.items[i];
        var sa = L.tile * (a.s || 1), area = sa * sa, cov = 0;
        for (var j = 0; j < S.items.length; j++) {
          var b = S.items[j];
          if (b === a || b.z <= a.z) continue;
          var sb = L.tile * (b.s || 1);
          var dx = Math.min(a.x + sa, b.x + sb) - Math.max(a.x, b.x);
          var dy = Math.min(a.y + sa, b.y + sb) - Math.max(a.y, b.y);
          if (dx > 0 && dy > 0) cov += dx * dy;
        }
        a.blocked = (cov / area) > 0.3;
      }
    }

    /* ---------- 关卡流程 ---------- */
    // 本关变体：每次进关现场随机抽（forced 仅供自检注入）
    function startLevel(level, forced) {
      S.level = level;
      // forced 仅供自检脚本注入指定变体，正常调用不传
      S.mods = (forced && forced.length) ? forced.slice() : rollMods(level, S.lastMods || null, S.run);
      S.lastMods = S.mods.slice();
      S.mod = {};
      for (var mi = 0; mi < S.mods.length; mi++) S.mod[S.mods[mi]] = true;
      S.mod.__count = S.mods.length;
      S.mod.__keys = S.mods;
      CUR_MOD = S.mod;
      S.slotMax = SLOT_MAX - (S.mod.fewSlots ? 1 : 0);
      // 锁格：末尾两格先锁着，每消掉一组解锁一格
      S.lockCells = S.mod.lockCell ? 2 : 0;
      // 限时 / 限步 / 自动进槽 / 反向槽
      S.timeLeft = S.mod.timer ? (150 + 8 * Math.min(2, Math.max(0, S.mods.length - 6))) : 0;
      S.dockMax = S.mod.dock1 ? 1 : 3;      // 暂放区容量
      S.flyDur = S.mod.slowSlot ? 0.62 : 0.24;   // 芯片飞进槽的时长
      S.slipLeft = S.mod.slip ? 3 : 0;           // 溜手：每关最多滑回去 3 次
      S.spinA = 0;                               // 自转的公共角度
      S.fog = null;
      S.fogT = 0;
      S.tapLeft = 0;
      S.drainT = 0;
      S.slotRev = !!S.mod.mirrorSlots;
      buildColourMap(level);
      layout();

      // 生成后先跑求解器验证可解，跑不通就重掷布局（最多 4 次）
      var items = null, tries = 0;
      for (tries = 0; tries < 4; tries++) {
        items = makeItems(level);
        S.items = items;
        S.pending = [];
        placeAll();
        // 分批上桌的关整盘还没出现，跳过可解校验；其余关按本关槽数校验
        if (S.mod.refill || canClear(items, L.tile, S.slotMax - (S.mod.lockSlot ? 1 : 0) - (S.mod.lockCell ? 2 : 0))) break;
      }
      S.tries = tries + 1;
      // 米粒件：随机挑 3 件缩到 0.55
      if (S.mod.tiny) {
        for (var ti = 0; ti < 3 && ti < items.length; ti++) {
          var tgt = items[Math.floor(Math.random() * items.length)];
          if (!tgt.fake) tgt.s = 0.55;
        }
      }
      S.items = items;
      // 盲盒：挑 2~3 件完全看不出来，点一下才显形
      if (S.mod.blind) {
        var bcnt = Math.min(3, Math.max(2, Math.floor(items.length / 12)));
        var shuffled = items.slice();
        for (var bi = shuffled.length - 1; bi > 0; bi--) {
          var bj = Math.floor(Math.random() * (bi + 1));
          var bt = shuffled[bi]; shuffled[bi] = shuffled[bj]; shuffled[bj] = bt;
        }
        for (var bk = 0; bk < bcnt && bk < shuffled.length; bk++) shuffled[bk].blind = true;
      }
      // 限步：预算按"件数 + 需要点两下的件 + 一点余量"
      if (S.mod.limitedTaps) {
        var twoTap = 0;
        for (var tk = 0; tk < items.length; tk++) if (items[tk].veil || items[tk].glue || items[tk].ice) twoTap++;
        S.tapLeft = items.length + twoTap + 5 + 3 * Math.min(2, Math.max(0, S.mods.length - 6));
      }
      if (S.mod.refill) splitPending(items);
      placeAll();
      // 空心件：上桌后再混 2~3 件假的（点了直接消失、不占槽），保证它们都在桌面
      if (S.mod.decoys) {
        var dcnt = Math.min(3, Math.max(2, Math.floor(items.length / 14)));
        var keys = ['red', 'blue', 'green', 'yellow', 'purple', 'pink', 'orange', 'teal', 'brown'];
        for (var di = 0; di < dcnt; di++) {
          items.push({ key: keys[Math.floor(Math.random() * keys.length)], x: 0, y: 0, s: 1, rot: 0, fake: true, blocked: false,
            cx: Math.random() * 0.9 + 0.05, cy: Math.random() * 0.9 + 0.05, jx: 0, jy: 0,
            z: Math.floor(items.length * (0.35 + Math.random() * 0.5)) });
        }
        placeAll();
      }

      S.slots = [];
      S.shelf = [];
      S.flying = [];
      S.timers = [];
      S.junkLeft = S.mod.junk2 ? 2 : (S.mod.lockSlot ? 1 : 0);
      S.junk = S.junkLeft;
      for (var jk = 0; jk < S.junkLeft; jk++) {
        S.slots.push({ id: ++slotSeq, type: 'junk', born: 1, landed: true, dying: 0 });
      }
      // 变体关按机制开销给救场道具：少一格最难，补足道具；道具荒只去撤销/移出
      var hvCnt = heavyCount(S.mods);
      var bonus = S.mods.length >= 7 ? 1 : 0;      // 变体叠到 7 个以上多给一轮救场
      S.undoLeft = S.mod.noTool ? 0 : (S.mod.fewSlots ? 2 : (S.mods.length >= 3 ? 2 : 1)) + bonus;
      S.shuffleLeft = (S.mod.fewSlots ? 2 : 1) + bonus;
      S.removeLeft = S.mod.noTool ? 0 : (S.mod.fewSlots ? 3 : 1) + bonus;
      S.refillLeft = 2;
      S.shakeLeft = 3;
      S.shakeCD = 0;
      S.shakeAnim = 0;
      S.busy = false;
      S.needCheck = false;
      S.clears = 0;
      S.tight = tightnessOf(level);
      S.hint = (level === 1);
      S.screen = 'play';
      placeAll();
      if (S.mods.length) {
        var tips = [];
        for (var tm = 0; tm < S.mods.length; tm++) {
          var md = MOD_DEFS[S.mods[tm]];
          // 叠了三个以上就只报名字，四条 tip 拼起来会撑破屏幕
          tips.push(md ? (S.mods.length >= 3 ? md.name : md.tip) : S.mods[tm]);
        }
        // 高周目会叠十几个变体，开场只报前 5 个名字，其余折成"等 N 种"
        if (tips.length > 5) tips = tips.slice(0, 5).concat(['等 ' + S.mods.length + ' 种']);
        toast(tips.join(' · '));
      }
    }

    // 分批上桌：先留出后 1/3 不上桌，消掉两组补一批
    function splitPending(items) {
      var cut = Math.max(3, Math.round(items.length / 3));
      cut = Math.min(cut, items.length - 3);
      S.pending = items.splice(items.length - cut, cut);
    }

    function placeOne(it) {
      var ts = L.tile * (it.s || 1);
      var maxX = Math.max(0, L.desk.w - ts);
      var maxY = Math.max(0, L.desk.h - ts);
      var padT = Math.min(ts * 0.14, maxX / 2, maxY / 2);
      it.x = clamp(rnd(0.08, 0.92) * maxX, padT, maxX - padT);
      it.y = clamp(rnd(0.08, 0.92) * maxY, padT, maxY - padT);
    }

    function addBatch() {
      if (!S.pending || !S.pending.length) return;
      var maxZ = 0;
      for (var i = 0; i < S.items.length; i++) if (S.items[i].z > maxZ) maxZ = S.items[i].z;
      var n = Math.min(3, S.pending.length);
      for (var k = 0; k < n; k++) {
        var it = S.pending.shift();
        it.z = maxZ + 0.5 + k;   // 补上来的落在上层，看得见也拿得到
        placeOne(it);
        S.items.push(it);
      }
      refreshBlocked();
      toast('又补上来 ' + n + ' 件');
      sfx('pick');
    }

    // 同色异形：让两个形状共用一个颜色，逼玩家只看形状
    function buildColourMap(level) {
      COLOR_MAP = null;
      if (!activeMod('sameColour')) return;
      var a = TYPES[Math.floor(Math.random() * TYPES.length)];
      var b = TYPES[Math.floor(Math.random() * TYPES.length)];
      if (b === a) b = TYPES[(TYPES.indexOf(a) + 1) % TYPES.length];
      var m = {};
      m[b.k] = a.c;
      COLOR_MAP = m;
    }

    function newRun() {
      S.score = 0;
      S.combo = 0;
      startLevel(1);
    }

    /* ---------- 取物 / 消除 ---------- */
    // 反向槽：第 n 个进槽的芯片画在最右边的格子里
    function slotIndexFor(n) {
      var usable = effSlotMax();
      return S.slotRev ? Math.max(0, usable - 1 - n) : n;
    }

    function slotPos(i) {
      var inner = L.slotBar.x + L.slotIn;
      var step = L.slotSize + L.slotGap;
      return { x: inner + i * step + L.slotSize / 2, y: L.slotBar.y + L.slotBar.h / 2 };
    }

    function topFreeAt(x, y) {
      var best = null;
      for (var i = 0; i < S.items.length; i++) {
        var it = S.items[i];
        var ts = L.tile * (it.s || 1);
        if (x < it.x + L.desk.x || x > it.x + L.desk.x + ts) continue;
        if (y < it.y + L.desk.y || y > it.y + L.desk.y + ts) continue;
        if (!best || it.z > best.z) best = it;
      }
      return (best && !best.blocked) ? best : null;
    }

    // 点到压住的空隙时，允许"就近取物"，手感更宽容，也不会出现点不动的死角
    function nearestFree(x, y, tol) {
      var best = null, bestD = tol * tol;
      for (var i = 0; i < S.items.length; i++) {
        var it = S.items[i];
        if (it.blocked) continue;
        var half = L.tile * (it.s || 1) / 2;
        var dx = x - (L.desk.x + it.x + half);
        var dy = y - (L.desk.y + it.y + half);
        var d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = it; }
      }
      return best;
    }

    // 蒙布 / 胶粘 / 冰封：先处理变体，再真正拿起来
    function tapItem(it) {
      if (S.busy || S.screen !== 'play') return;
      // 限步：每一次落在物件上的点选都算一次
      if (S.mod && S.mod.limitedTaps) {
        S.tapLeft--;
        if (S.tapLeft <= 0) { lose(); return; }
      }
      // 空心件：点一下就消失，不占槽
      if (it.fake) {
        var fidx = S.items.indexOf(it);
        if (fidx >= 0) S.items.splice(fidx, 1);
        S.tapFx = { x: it.x + L.desk.x + L.tile * 0.4, y: it.y + L.desk.y + L.tile * 0.4, t: 0, color: '#C9BFAC' };
        toast('空心的，直接消失');
        sfx('pick'); buzz('light');
        refreshBlocked();
        return;
      }
      // 按序取：只能先拿最上面那件
      if (S.mod && S.mod.orderPick) {
        var topZ = -1, both = null;
        for (var oi = 0; oi < S.items.length; oi++) {
          var other = S.items[oi];
          if (other.blocked || other.fake) continue;
          if (other.z > topZ) { topZ = other.z; both = other; }
        }
        if (both && both !== it) { toast('先把压在上面的拿走'); return; }
      }
      if (it.blind) {
        it.blind = false;
        S.tapFx = { x: it.x + L.desk.x + L.tile * (it.s || 1) / 2, y: it.y + L.desk.y + L.tile * (it.s || 1) / 2, t: 0, color: '#8C8271' };
        toast('看清了，再点一次拿走');
        sfx('pick'); buzz('light');
        return;
      }
      if (it.veil) {
        it.veil = false;
        S.tapFx = { x: it.x + L.desk.x + L.tile * (it.s || 1) / 2, y: it.y + L.desk.y + L.tile * (it.s || 1) / 2, t: 0, color: '#C9BFAC' };
        toast('揭开布，再点一次拿走');
        sfx('pick'); buzz('light');
        return;
      }
      if (it.glue) {
        it.glue = false;
        S.tapFx = { x: it.x + L.desk.x + L.tile * (it.s || 1) / 2, y: it.y + L.desk.y + L.tile * (it.s || 1) / 2, t: 0, color: '#E39B2F' };
        toast('撕开胶，再点一次');
        sfx('pick'); buzz('light');
        return;
      }
      if (it.ice) {
        it.ice = false;
        S.tapFx = { x: it.x + L.desk.x + L.tile * (it.s || 1) / 2, y: it.y + L.desk.y + L.tile * (it.s || 1) / 2, t: 0, color: '#7FB6D9' };
        toast('敲碎冰壳，再点一次');
        sfx('pick'); buzz('light');
        return;
      }
      pick(it);
    }

    function pick(it) {
      if (S.busy || S.screen !== 'play') return;
      var idx = S.items.indexOf(it);
      if (idx < 0) return;
      // 槽位 + 飞行中的物件合计不能超过上限，连点也不会溢出
      if (S.slots.length + S.flying.length >= effSlotMax()) {
        if (S.flying.length === 0) lose();
        return;
      }
      // 溜手：有概率滑回桌面（每关限 3 次，不会无限折腾）
      if (S.mod && S.mod.slip && S.slipLeft > 0 && Math.random() < 0.16) {
        S.slipLeft--;
        it.cx = Math.random() * 0.9 + 0.05;
        it.cy = Math.random() * 0.9 + 0.05;
        it.x = 0; it.y = 0;
        placeAll();
        S.tapFx = { x: L.desk.x + it.x + L.tile * (it.s || 1) / 2, y: L.desk.y + it.y + L.tile * (it.s || 1) / 2, t: 0, color: '#C9BFAC' };
        toast('手滑了，那件滑回桌面');
        sfx('pick'); buzz('light');
        return;
      }
      S.items.splice(idx, 1);
      S.hint = false;
      var target = slotPos(slotIndexFor(S.slots.length));
      var sid = ++slotSeq;
      S.flying.push({
        type: it.key, t: 0, dur: S.flyDur || 0.24,
        fx: it.x + L.desk.x, fy: it.y + L.desk.y,
        tx: target.x - L.tile / 2, ty: target.y - L.tile / 2,
        size: L.tile * (it.s || 1), rot: it.rot, slotId: sid
      });
      S.slots.push({ id: sid, type: it.key, born: 0, landed: false, dying: 0 });
      sfx('pick'); buzz('light');
      refreshBlocked();
    }

    function checkClear() {
      var counts = {}, key = null, i;
      for (i = 0; i < S.slots.length; i++) {
        if (!S.slots[i].landed) continue;   // 飞行中的芯片不参与判定，避免账目错乱
        var k = S.slots[i].type;
        if (k === 'junk') continue;         // 占位杂物不参与凑三
        counts[k] = (counts[k] || 0) + 1;
        if (counts[k] >= 3 && key === null) key = k;
      }
      if (!key) {
        if (S.slots.length >= effSlotMax()) lose();
        return;
      }
      S.busy = true;
      var now = Date.now();
      S.combo = (now - S.lastClear < 1600) ? S.combo + 1 : 1;
      S.lastClear = now;
      var gain = 100 * S.combo;
      S.score += gain;
      if (S.score > S.best) { S.best = S.score; persist(); }
      sfx('clear'); buzz('medium');

      var marked = 0;
      for (i = 0; i < S.slots.length && marked < 3; i++) {
        if (S.slots[i].type === key && S.slots[i].landed) { S.slots[i].dying = 0.001; marked++; }
      }
      var pos = slotPos(Math.min(3, S.slots.length - 1));
      burst(pos.x, pos.y, key);
      S.floats.push({ text: S.combo > 1 ? '+' + gain + ' ×' + S.combo : '+' + gain, x: W / 2, y: L.desk.y + 52, t: 0, dur: 1.0 });
      S.flash = 0.32;

      S.timers.push({ t: 0.26, fn: function () {
        var keep = [];
        for (var q = 0; q < S.slots.length; q++) if (!(S.slots[q].dying > 0)) keep.push(S.slots[q]);
        S.slots = keep;
        // 占位杂物：每消掉一组就带走一件
        if (S.junkLeft > 0) {
          S.junkLeft--;
          for (var jz = 0; jz < S.slots.length; jz++) {
            if (S.slots[jz].type === 'junk') { S.slots.splice(jz, 1); break; }
          }
          toast('清走一件杂物');
        }
        S.clears++;
        S.busy = false;
        // 锁格：每消掉一组解锁一格
        if (S.lockCells > 0) { S.lockCells--; toast('开了一格槽位'); }
        // 分批上桌：每消掉两组补一批
        if (S.mods && S.mod.refill && S.pending.length && S.clears % 2 === 0) addBatch();
        // 挪窝：每消掉一组，桌面剩下的一起重排位置
        if (S.mod.moveOnClear && S.items.length) placeAll();
        // 渐缩：每消掉一组，桌面物件整体再小一圈（只缩不动，保中心）
        if (S.mod.shrink) {
          for (var sk = 0; sk < S.items.length; sk++) {
            var it2 = S.items[sk];
            var ns = Math.max(0.55, (it2.s || 1) * 0.9);
            var hw = L.tile * ns / 2 - L.tile * (it2.s || 1) / 2;
            it2.s = ns;
            it2.x = Math.min(L.desk.w - L.tile * ns, Math.max(0, it2.x + hw));
            it2.y = Math.min(L.desk.h - L.tile * ns, Math.max(0, it2.y + hw));
          }
        }
        // 洗槽：每消掉一组，槽里剩下的芯片顺序重排（内容不变）
        if (S.mod.slotShuffle && S.slots.length > 1) {
          for (var ss = S.slots.length - 1; ss > 0; ss--) {
            var sj = Math.floor(Math.random() * (ss + 1));
            var tmpS = S.slots[ss]; S.slots[ss] = S.slots[sj]; S.slots[sj] = tmpS;
          }
        }
        if (S.items.length === 0 && S.slots.length === 0 && S.shelf.length === 0 && S.pending.length === 0) { win(); }
        else if (S.items.length === 0 && S.pending.length === 0 && S.slots.length + S.shelf.length > 0) { /* 等玩家清槽 */ }
        else if (S.slots.length >= effSlotMax()) { lose(); }
      } });
    }

    function burst(x, y, key) {
      var color = colorOf(key);
      for (var p = 0; p < 12; p++) {
        var a = rnd(0, Math.PI * 2), sp = rnd(60, 180);
        S.parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, r: rnd(2, 4.5), c: color, t: 0, life: rnd(0.35, 0.6) });
      }
    }

    function win() {
      S.screen = 'win';
      var nx = Math.min(LEVEL_TOTAL + 1, Math.max(S.runMax[S.run] || 1, S.level + 1));
      S.runMax[S.run] = nx;
      // 本轮 100 关全部清空：解锁下周目
      if (S.level >= LEVEL_TOTAL && !S.runMax[S.run + 1]) S.runMax[S.run + 1] = 1;
      S.maxLevel = nx;
      persist();
      sfx('win'); buzz('heavy');
    }

    function lose() {
      S.screen = 'lose';
      S.runMax[S.run] = Math.max(S.runMax[S.run] || 1, S.level);
      S.maxLevel = S.runMax[S.run];
      persist();
      sfx('lose'); buzz('heavy');
    }

    /* ---------- 道具 ---------- */
    function toast(t, dur) { S.toast = t; S.toastT = dur || 1.2; }

    function newItem(type) {
      return { key: type, z: 900 + Math.random() * 40, rot: Math.round(rnd(-13, 13)), cx: rnd(0.25, 0.75), cy: rnd(0.25, 0.75), jx: 0, jy: 0, x: 0, y: 0, s: Math.round(rnd(SIZE_MIN, SIZE_MAX) * 100) / 100, blocked: false };
    }

    function doUndo() {
      if (S.busy || S.screen !== 'play') return;
      if (S.undoLeft <= 0) { tryReward('undo'); return; }
      if (!S.slots.length) { toast('槽里没有东西'); return; }
      var chip = S.slots.pop();
      S.undoLeft -= S.mod.toolCost ? 2 : 1;
      S.items.push(newItem(chip.type));
      placeAll();
      sfx('pick'); toast('撤回一件');
    }

    // 移出：把槽里最没进展的 3 件挪到旁边“暂放区”，之后随时可以拿回来
    function doRemove() {
      if (S.busy || S.screen !== 'play') return;
      if (S.flying.length) return;   // 有物件还在飞，等落定再挪，避免槽位错位
      if (S.removeLeft <= 0) { tryReward('remove'); return; }
      var room = (S.dockMax || 3) - S.shelf.length;
      if (room <= 0) { toast('暂放区放满了'); return; }
      var counts = {}, i;
      for (i = 0; i < S.slots.length; i++) {
        if (!S.slots[i].landed) continue;
        counts[S.slots[i].type] = (counts[S.slots[i].type] || 0) + 1;
      }
      var ordered = [];
      for (i = 0; i < S.slots.length; i++) {
        if (!S.slots[i].landed) continue;
        ordered.push({ i: i, c: counts[S.slots[i].type] });
      }
      if (!ordered.length) { toast('槽里没有东西'); return; }
      ordered.sort(function (x, y) { return x.c - y.c || y.i - x.i; });
      var take = Math.min(room, 3, ordered.length);
      var takenIds = [];
      for (i = 0; i < take; i++) {
        var chip = S.slots[ordered[i].i];
        if (!chip) continue;
        takenIds.push(chip.id);
        S.shelf.push({ type: chip.type });
      }
      S.slots = S.slots.filter(function (c) { return takenIds.indexOf(c.id) < 0; });
      S.removeLeft -= S.mod.toolCost ? 2 : 1;
      sfx('pick'); buzz('light');
      toast('移出 ' + takenIds.length + ' 件，放在旁边');
    }

    // 从暂放区拿一件回槽里（不消耗道具，想拿就拿）
    function takeFromShelf(idx) {
      if (S.busy || S.screen !== 'play') return;
      var chip = S.shelf[idx];
      if (!chip) return;
      if (S.slots.length + S.flying.length >= effSlotMax()) { toast('槽位满了'); return; }
      var r = L.shelfChips[idx] || L.shelfChips[0];
      S.shelf.splice(idx, 1);
      var target = slotPos(slotIndexFor(S.slots.length));
      var sid = ++slotSeq;
      S.flying.push({
        type: chip.type, t: 0, dur: 0.18,
        fx: r.x, fy: r.y,
        tx: target.x - L.tile / 2, ty: target.y - L.tile / 2,
        size: L.tile, rot: 0, slotId: sid
      });
      S.slots.push({ id: sid, type: chip.type, born: 0, landed: false, dying: 0 });
      sfx('pick');
    }

    // 抖一抖：物件轻微位移，被压住的会露出边角；不耗道具，每关 3 次
    function doShake() {
      if (S.busy || S.screen !== 'play') return;
      if (S.shakeCD > 0) return;
      if (S.shakeLeft <= 0) { toast('这一关抖完了'); return; }
      S.shakeLeft -= S.mod.toolCost ? 2 : 1;
      S.shakeCD = 0.9;
      S.shakeAnim = 0.34;
      for (var i = 0; i < S.items.length; i++) {
        var it = S.items[i];
        it.jx = clamp(it.jx + rnd(-0.26, 0.26), -2.6, 2.6);
        it.jy = clamp(it.jy + rnd(-0.22, 0.22), -2.6, 2.6);
        it.rot = Math.round(clamp(it.rot + rnd(-8, 8), -16, 16));
      }
      placeAll();
      sfx('pick'); buzz('medium');
      toast('抖了抖桌面');
    }

    function doShuffle() {
      if (S.busy || S.screen !== 'play') return;
      if (S.shuffleLeft <= 0) { tryReward('shuffle'); return; }
      if (!S.items.length) return;
      S.shuffleLeft -= S.mod.toolCost ? 2 : 1;
      scatter(S.items, S.tight);
      placeAll();
      sfx('pick'); toast('重新堆了一遍');
    }

    function tryReward(kind) {
      if (S.refillLeft <= 0) { toast('本关补充次数已用完'); return; }
      A.rewarded(function (ok) {
        if (!ok) { toast('广告暂不可用'); return; }
        if (kind === 'undo') S.undoLeft++;
        if (kind === 'shuffle') S.shuffleLeft++;
        if (kind === 'remove') S.removeLeft++;
        S.refillLeft--;
        toast('补充 1 次');
      });
    }

    /* ---------- 绘制基础 ---------- */
    function text(s, x, y, size, weight, color, align, baseline) {
      ctx.font = weight + ' ' + size + 'px ' + FONT;
      ctx.fillStyle = color;
      ctx.textAlign = align || 'left';
      ctx.textBaseline = baseline || 'middle';
      ctx.fillText(s, x, y);
    }

    function inRect(x, y, r) {
      return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    }

    function drawTile(x, y, size, type, rot, blocked, scale, alpha) {
      ctx.save();
      ctx.translate(x + size / 2, y + size / 2);
      ctx.rotate((rot || 0) * Math.PI / 180);
      var sc = scale || 1;
      ctx.scale(sc, sc);
      var h = size / 2;
      ctx.globalAlpha = (alpha == null ? 1 : alpha);
      ctx.shadowColor = 'rgba(34,31,26,0.20)';
      ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 3; ctx.shadowBlur = 0;
      ctx.fillStyle = blocked ? '#F4EFE3' : '#FFFDF7';
      rr(ctx, -h, -h, size, size, 11); ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
      ctx.lineWidth = 2;
      ctx.strokeStyle = blocked ? '#A79C86' : COL.ink;
      rr(ctx, -h, -h, size, size, 11); ctx.stroke();
      ctx.globalAlpha = (alpha == null ? 1 : alpha) * (blocked ? 0.42 : 1);
      // 灰模：所有物件只留形状，不给颜色；镜像：形状左右翻
      var glyphColor = activeMod('grey') ? '#9A9183' : colorOf(type);
      var flip = activeMod('mirror') ? -1 : 1;
      var vflip = activeMod('upside') ? -1 : 1;
      ctx.save();
      ctx.scale(flip, vflip);
      drawGlyph(ctx, type, 0, 0, size * 0.56, glyphColor);
      ctx.restore();
      ctx.restore();
    }

    /* ---------- 顶栏 ---------- */
    function drawHud() {
      var pills = [
        { r: L.lvPill, k: S.run > 1 ? ('第 ' + S.run + ' 周目') : '关卡', v: String(S.level) },
        { r: L.scorePill, k: '得分', v: String(S.score) }
      ];
      // 限时 / 限步：右上角单独一块倒计时牌（两者互斥，只会出现一种）
      if (S.mod && S.mod.timer) {
        pills.push({ r: L.statPill, k: '限时', v: '剩 ' + Math.max(0, Math.ceil(S.timeLeft)) + 's' });
      } else if (S.mod && S.mod.limitedTaps) {
        pills.push({ r: L.statPill, k: '限步', v: '剩 ' + Math.max(0, S.tapLeft) + ' 次' });
      }
      for (var i = 0; i < pills.length; i++) {
        var r = pills[i].r;
        ctx.save();
        ctx.shadowColor = 'rgba(34,31,26,0.18)'; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
        ctx.fillStyle = COL.panel; rr(ctx, r.x, r.y, r.w, r.h, 10); ctx.fill();
        ctx.restore();
        ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; rr(ctx, r.x, r.y, r.w, r.h, 10); ctx.stroke();
        text(pills[i].k, r.x + 10, r.y + 14, 9, 'bold', COL.muted);
        var vSize = 17;
        ctx.font = 'bold ' + vSize + 'px ' + FONT;
        while (vSize > 11 && ctx.measureText(pills[i].v).width > r.w - 20) {
          vSize--;
          ctx.font = 'bold ' + vSize + 'px ' + FONT;
        }
        text(pills[i].v, r.x + 10, r.y + 32, vSize, 'bold', COL.ink);
      }
      drawSoundBtn(L.soundBtn);
    }

    function drawSoundBtn(r) {
      ctx.save();
      ctx.shadowColor = 'rgba(34,31,26,0.18)'; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
      ctx.fillStyle = COL.panel; rr(ctx, r.x, r.y, r.w, r.h, 10); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; rr(ctx, r.x, r.y, r.w, r.h, 10); ctx.stroke();

      var cx = r.x + r.w / 2 - 2, cy = r.y + r.h / 2;
      ctx.strokeStyle = S.sound ? COL.ink : '#B6AC99';
      ctx.fillStyle = S.sound ? COL.ink : '#B6AC99';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy - 4); ctx.lineTo(cx - 4, cy - 4);
      ctx.lineTo(cx + 2, cy - 9); ctx.lineTo(cx + 2, cy + 9);
      ctx.lineTo(cx - 4, cy + 4); ctx.lineTo(cx - 9, cy + 4);
      ctx.closePath(); ctx.fill();
      if (S.sound) {
        ctx.beginPath(); ctx.arc(cx + 2, cy, 6, -0.9, 0.9); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx + 2, cy, 10, -0.9, 0.9); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(cx - 6, cy + 7); ctx.lineTo(cx + 8, cy - 7); ctx.stroke();
      }
    }

    // 盲槽：槽里的芯片只给一个问号，攒了什么得靠自己记
    function drawSlotBlind(x, y, size, sc, al) {
      ctx.save();
      ctx.translate(x + size / 2, y + size / 2);
      ctx.scale(sc || 1, sc || 1);
      ctx.globalAlpha = al == null ? 1 : al;
      var h = size / 2;
      ctx.fillStyle = '#F4EEE2';
      rr(ctx, -h, -h, size, size, 10); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#8C8271';
      rr(ctx, -h, -h, size, size, 10); ctx.stroke();
      ctx.restore();
      text('?', x + size / 2, y + size / 2, Math.round(size * 0.42 * (sc || 1)), 'bold', '#8C8271', 'center');
    }

    // 空心件：看起来像真件，但边框是虚线、整体更淡，一眼能看出是假的
    function drawFakeTile(x, y, size, type, rot, blocked) {
      ctx.save();
      ctx.translate(x + size / 2, y + size / 2);
      ctx.rotate((rot || 0) * Math.PI / 180);
      var h = size / 2;
      ctx.globalAlpha = blocked ? 0.4 : 0.62;
      ctx.fillStyle = '#F7F2E8';
      rr(ctx, -h, -h, size, size, 11); ctx.fill();
      ctx.lineWidth = 1.8; ctx.strokeStyle = '#BDB3A0';
      ctx.setLineDash([5, 4]);
      rr(ctx, -h, -h, size, size, 11); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = blocked ? 0.28 : 0.42;
      drawGlyph(ctx, type, 0, 0, size * 0.56, colorOf(type));
      ctx.restore();
    }

    // 盲盒：只画一个虚线框和问号，点一下才显形
    function drawBlindTile(x, y, size, blocked) {
      ctx.save();
      ctx.globalAlpha = blocked ? 0.55 : 1;
      ctx.fillStyle = '#F2ECE0';
      rr(ctx, x, y, size, size, 11); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = blocked ? '#A79C86' : '#B4A995';
      ctx.setLineDash([5, 5]);
      rr(ctx, x, y, size, size, 11); ctx.stroke();
      ctx.restore();
      text('?', x + size / 2, y + size / 2, Math.round(size * 0.42), 'bold', blocked ? '#9C9280' : '#8C8271', 'center');
    }

    /* ---------- 桌面 ---------- */
    function drawDesk() {
      var d = L.desk;
      ctx.save();
      ctx.shadowColor = 'rgba(34,31,26,0.20)'; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
      ctx.fillStyle = COL.panel;
      rr(ctx, d.x, d.y, d.w, d.h, 16); ctx.fill();
      ctx.restore();
      if (bgLayer) {
        ctx.save();
        rr(ctx, d.x, d.y, d.w, d.h, 16); ctx.clip();
        ctx.drawImage(bgLayer, d.x, d.y, d.w, d.h);
        ctx.restore();
      }
      // 暗桌：压一层深色，物件是白卡，对比还在但整体更难分
      if (activeMod('darkDesk')) {
        ctx.save();
        rr(ctx, d.x, d.y, d.w, d.h, 16); ctx.clip();
        ctx.fillStyle = 'rgba(30,28,24,0.74)';
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.restore();
      }
      ctx.lineWidth = 2; ctx.strokeStyle = COL.ink;
      rr(ctx, d.x, d.y, d.w, d.h, 16); ctx.stroke();

      // 抖一抖的桌面晃动
      var shX = 0, shY = 0;
      if (S.shakeAnim > 0) {
        var amp = S.shakeAnim * 14;
        shX = Math.sin(S.shakeAnim * 46) * amp;
        shY = Math.cos(S.shakeAnim * 38) * amp * 0.55;
      }

      // 物件：按 z 从低到高
      var sorted = S.items.slice().sort(function (a, b) { return a.z - b.z; });
      for (var i = 0; i < sorted.length; i++) {
        var it = sorted[i];
        var its = L.tile * (it.s || 1);
        var ix = d.x + it.x + shX, iy = d.y + it.y + shY;
        // 自转：整桌共享一个缓慢角度，遮挡判定仍按矩形，不受影响
        var irot = it.rot + (S.mod && S.mod.spin ? S.spinA * 57.2958 : 0);
        if (it.fake) {
          drawFakeTile(ix, iy, its, it.key, irot, it.blocked);
        } else if (it.blind) {
          drawBlindTile(ix, iy, its, it.blocked);
        } else {
          drawTile(ix, iy, its, it.key, irot, it.blocked, 1, 1);
          drawItemMod(it, ix, iy, its);
        }
      }

      drawShelf();

      // 飞行中的物件
      for (var f = 0; f < S.flying.length; f++) {
        var fy = S.flying[f];
        var t = Math.min(1, fy.t / fy.dur);
        var e = 1 - Math.pow(1 - t, 3);
        var x = fy.fx + (fy.tx - fy.fx) * e;
        var y = fy.fy + (fy.ty - fy.fy) * e - Math.sin(t * Math.PI) * 26;
        var scale = 1 - 0.18 * e;
        drawTile(x, y, fy.size, fy.type, fy.rot * (1 - e), false, scale, 1);
      }

      // 新手引导
      if (S.hint && S.screen === 'play') {
        var pulse = 0.5 + 0.5 * Math.sin(Date.now() / 320);
        var free = [];
        for (var k = 0; k < S.items.length && free.length < 3; k++) {
          if (!S.items[k].blocked) free.push(S.items[k]);
        }
        for (var q = 0; q < free.length; q++) {
          ctx.save();
          ctx.globalAlpha = 0.35 + pulse * 0.4;
          ctx.strokeStyle = '#E39B2F'; ctx.lineWidth = 3;
          var fs = L.tile * (free[q].s || 1);
          rr(ctx, d.x + free[q].x - 3, d.y + free[q].y - 3, fs + 6, fs + 6, 13);
          ctx.stroke();
          ctx.restore();
        }
        text('点没被压住的物件', d.x + d.w / 2, d.y + d.h - 16, 12, 'bold', '#A79B85', 'center');
      }
    }

    /* ---------- 暂放区 ---------- */
    function drawShelf() {
      if (!S.shelf.length) return;
      var b = L.shelf, ss = L.shelfSize;
      ctx.save();
      ctx.shadowColor = 'rgba(34,31,26,0.16)'; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3;
      ctx.fillStyle = COL.soft; rr(ctx, b.x, b.y, b.w, b.h, 10); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 1.5; ctx.strokeStyle = COL.muted;
      rr(ctx, b.x, b.y, b.w, b.h, 10); ctx.stroke();
      // 标签带一个实底小胶囊，压在物件上也看得清
      var lab = '暂放 · 可再拿';
      ctx.font = 'bold 9px ' + FONT;
      var lw = ctx.measureText(lab).width + 12;
      ctx.fillStyle = COL.panel;
      rr(ctx, b.x, b.y - 17, lw, 15, 7); ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = COL.line;
      rr(ctx, b.x, b.y - 17, lw, 15, 7); ctx.stroke();
      text(lab, b.x + 6, b.y - 9, 9, 'bold', COL.muted);
      for (var i = 0; i < S.shelf.length; i++) {
        var r = L.shelfChips[i];
        drawTile(r.x, r.y, ss, S.shelf[i].type, 0, false, 1, 1);
      }
    }

    // 起雾：桌面上盖一块半透明雾气（挡视线不挡点击）
    function drawFog() {
      if (!S.fog) return;
      var f = S.fog;
      var cx = L.desk.x + f.x, cy = L.desk.y + f.y;
      var a = Math.min(1, Math.min(f.t, 1.7 - f.t) / 0.35);
      if (a <= 0) return;
      ctx.save();
      ctx.globalAlpha = 0.92 * Math.max(0, a);
      var g = null;
      if (typeof ctx.createRadialGradient === 'function') {
        g = ctx.createRadialGradient(cx, cy, 8, cx, cy, f.r);
        if (g && typeof g.addColorStop === 'function') {
          g.addColorStop(0, 'rgba(158,150,138,0.62)');
          g.addColorStop(0.6, 'rgba(166,158,146,0.42)');
          g.addColorStop(1, 'rgba(170,162,150,0)');
        } else g = null;
      }
      ctx.fillStyle = g || 'rgba(160,152,140,0.5)';
      ctx.beginPath(); ctx.arc(cx, cy, f.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 蒙布 / 胶粘 / 冰封 的视觉标记
    function drawItemMod(it, x, y, size) {
      if (it.veil) {
        ctx.save();
        ctx.globalAlpha = 0.92;
        ctx.fillStyle = '#D8CEBB';
        rr(ctx, x + 1, y + 1, size - 2, size - 2, 10); ctx.fill();
        ctx.strokeStyle = '#B9AE97'; ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x + size * 0.5, y + 3); ctx.lineTo(x + size * 0.5, y + size - 3);
        ctx.moveTo(x + 4, y + size * 0.7); ctx.lineTo(x + size - 4, y + size * 0.7);
        ctx.stroke();
        ctx.fillStyle = '#8C8271';
        ctx.beginPath(); ctx.arc(x + size * 0.5, y + size * 0.35, size * 0.09, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      if (it.glue) {
        ctx.save();
        ctx.fillStyle = '#E39B2F';
        for (var g = 0; g < 3; g++) {
          var gx = x + size * (0.32 + g * 0.18), gy = y + size * (0.5 + (g % 2 ? -0.22 : 0.2));
          ctx.beginPath(); ctx.arc(gx, gy, size * 0.06, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
      if (it.ice) {
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#BFE0F2';
        rr(ctx, x, y, size, size, 10); ctx.fill();
        ctx.globalAlpha = 0.95;
        ctx.strokeStyle = '#8FC0DC'; ctx.lineWidth = 1.6;
        rr(ctx, x + 2, y + 2, size - 4, size - 4, 9); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + size * 0.2, y + size * 0.62); ctx.lineTo(x + size * 0.42, y + size * 0.4);
        ctx.lineTo(x + size * 0.58, y + size * 0.58); ctx.lineTo(x + size * 0.8, y + size * 0.36);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawModStrip() {
      if (!S.mods || !S.mods.length) { L.modChips = []; return; }
      var strip = L.modStrip;
      var keys = S.mods.slice(), names = [];
      for (var i = 0; i < S.mods.length; i++) names.push(MOD_DEFS[S.mods[i]] ? MOD_DEFS[S.mods[i]].name : S.mods[i]);
      text('本关新花样', strip.x, strip.y + 11, 9, 'bold', COL.muted);
      var lx = strip.x + 56;
      // 高周目会叠到十几个变体，条上只铺 4 个，其余收进 +N
      var shown = names.length > 4 ? names.slice(0, 4) : names;
      var shownKeys = names.length > 4 ? keys.slice(0, 4) : keys;
      L.modChips = [];                                  // 供 onDown 命中，点 chip 弹该变体简介
      names = shown.concat(names.length > 4 ? ['+' + (names.length - 4)] : []);
      for (var n = 0; n < names.length; n++) {
        ctx.save();
        ctx.fillStyle = COL.soft;
        var wName = 11 + names[n].length * 9;
        rr(ctx, lx, strip.y + 1, wName, 16, 8); ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = '#D6CBBA';
        rr(ctx, lx, strip.y + 1, wName, 16, 8); ctx.stroke();
        ctx.restore();
        text(names[n], lx + 6, strip.y + 9, 9, 'bold', COL.ink);
        L.modChips.push({
          x: lx, y: strip.y - 4, w: wName, h: 24,          // 上下各放宽一点，手指好按
          key: (n < shownKeys.length) ? shownKeys[n] : null,
          more: (n < shownKeys.length) ? null : keys.slice(4)
        });
        lx += wName + 6;
      }
      if (S.pending && S.pending.length) {
        text('未上桌 ' + S.pending.length, strip.x + strip.w, strip.y + 11, 9, 'normal', COL.muted, 'right');
      }
    }

    function drawTapFx() {
      if (!S.tapFx) return;
      var f = S.tapFx, p = Math.min(1, f.t / 0.45);
      ctx.save();
      ctx.globalAlpha = 1 - p;
      ctx.strokeStyle = f.color || COL.ink;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, 10 + p * 22, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    /* ---------- 槽位 ---------- */
    function drawSlots() {
      var b = L.slotBar;
      ctx.save();
      ctx.shadowColor = 'rgba(34,31,26,0.20)'; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
      ctx.fillStyle = COL.slot; rr(ctx, b.x, b.y, b.w, b.h, 14); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; rr(ctx, b.x, b.y, b.w, b.h, 14); ctx.stroke();

      var usable = effSlotMax();
      var revUsed = -1;
      for (var i = 0; i < S.slotMax; i++) {
        var pos = slotPos(i);
        var hs = L.slotSize / 2;
        var chip = null;
        if (i < usable) {
          revUsed = S.slotRev ? (usable - 1 - i) : i;
          chip = (revUsed >= 0 && revUsed < S.slots.length) ? S.slots[revUsed] : null;
        }
        if (!chip && i >= usable) {
          // 被锁的格子：深色底 + 小锁
          ctx.save();
          ctx.fillStyle = '#E7DFCF';
          rr(ctx, pos.x - hs, pos.y - hs, L.slotSize, L.slotSize, 10); ctx.fill();
          ctx.lineWidth = 1.6; ctx.strokeStyle = '#B8AE9B';
          rr(ctx, pos.x - hs, pos.y - hs, L.slotSize, L.slotSize, 10); ctx.stroke();
          ctx.restore();
          drawLock(pos.x, pos.y + 2);
          continue;
        }
        if (chip && chip.type === 'junk') {
          ctx.save();
          ctx.fillStyle = '#E6DECD';
          rr(ctx, pos.x - hs, pos.y - hs, L.slotSize, L.slotSize, 10); ctx.fill();
          ctx.lineWidth = 1.6; ctx.strokeStyle = '#B8AE9B';
          rr(ctx, pos.x - hs, pos.y - hs, L.slotSize, L.slotSize, 10); ctx.stroke();
          ctx.strokeStyle = '#9C9280';
          ctx.beginPath();
          ctx.moveTo(pos.x - hs * 0.45, pos.y - hs * 0.45); ctx.lineTo(pos.x + hs * 0.45, pos.y + hs * 0.45);
          ctx.moveTo(pos.x + hs * 0.45, pos.y - hs * 0.45); ctx.lineTo(pos.x - hs * 0.45, pos.y + hs * 0.45);
          ctx.stroke();
          ctx.restore();
        } else if (!chip) {
          ctx.save();
          ctx.lineWidth = 2;
          ctx.strokeStyle = (i === S.slots.length) ? '#AFA492' : COL.line;
          ctx.setLineDash([5, 5]);
          rr(ctx, pos.x - hs, pos.y - hs, L.slotSize, L.slotSize, 10);
          ctx.stroke();
          ctx.restore();
        } else {
          var sc = 1, al = 1;
          if (!chip.landed) { sc = 0.01; al = 0.2; }
          else if (chip.born < 0.18) { var bp = chip.born / 0.18; sc = 0.6 + 0.4 * bp; }
          if (chip.dying > 0) { sc = 1 - Math.min(0.9, chip.dying * 3); al = 1 - Math.min(1, chip.dying * 3); }
          if (activeMod('darkSlot') && chip.type !== 'junk') al *= 0.45;
          if (activeMod('blindSlots') && chip.type !== 'junk') {
            drawSlotBlind(pos.x - hs, pos.y - hs, L.slotSize, sc, al);
          } else {
            drawTile(pos.x - hs, pos.y - hs, L.slotSize, chip.type, 0, false, sc, al);
          }
        }
      }
    }

    /* ---------- 道具栏 ---------- */
    function drawTools() {
      var icons = ['undo', 'shuffle', 'remove', 'shake'];
      var counts = [S.undoLeft, S.shuffleLeft, S.removeLeft, S.shakeLeft];
      for (var i = 0; i < L.tools.length; i++) {
        var r = L.tools[i];
        var disabled = counts[i] <= 0;
        ctx.save();
        ctx.globalAlpha = disabled ? 0.55 : 1;
        ctx.shadowColor = 'rgba(34,31,26,0.16)'; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
        ctx.fillStyle = COL.panel; rr(ctx, r.x, r.y, r.w, r.h, 11); ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = disabled ? 0.55 : 1;
        ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; rr(ctx, r.x, r.y, r.w, r.h, 11); ctx.stroke();
        ctx.save();
        ctx.translate(r.x + 14, r.y + r.h / 2);
        ctx.scale(0.72, 0.72);
        drawToolIcon(icons[i], 0, 0);
        ctx.restore();
        text(r.label, r.x + 25, r.y + r.h / 2, 10, 'bold', COL.ink);
        // 次数角标
        var bx = r.x + r.w - 9, by = r.y + r.h / 2;
        ctx.strokeStyle = COL.line; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI * 2); ctx.stroke();
        text(String(counts[i]), bx, by + 0.5, 9, 'bold', COL.muted, 'center');
        ctx.restore();
      }
    }

    function drawToolIcon(kind, x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = COL.ink; ctx.fillStyle = COL.ink; ctx.lineWidth = 2; ctx.lineCap = 'round';
      if (kind === 'undo') {
        ctx.beginPath(); ctx.arc(0, 1, 7, Math.PI * 0.9, Math.PI * 2.35); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-7, -7); ctx.lineTo(-1, -7); ctx.lineTo(-7, 0); ctx.stroke();
      } else if (kind === 'shuffle') {
        ctx.beginPath();
        ctx.moveTo(-8, -4); ctx.lineTo(-3, -4); ctx.lineTo(7, 4); ctx.lineTo(8, 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(8, 4); ctx.lineTo(5, 1); ctx.moveTo(8, 4); ctx.lineTo(5, 7);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-8, 4); ctx.lineTo(-3, 4); ctx.lineTo(-1, 2.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(7, -4); ctx.lineTo(8, -4); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(8, -4); ctx.lineTo(5, -7); ctx.moveTo(8, -4); ctx.lineTo(5, -1);
        ctx.stroke();
      } else if (kind === 'remove') {
        ctx.beginPath();
        ctx.rect(-3, -8, 8, 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(9, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(5, -4); ctx.moveTo(9, 0); ctx.lineTo(5, 4); ctx.stroke();
      } else {
        // 抖一抖：手机轮廓 + 两侧震动线
        ctx.beginPath();
        ctx.rect(-5, -8, 10, 16); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(-10, -1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-10, 2); ctx.lineTo(-10, 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, -6); ctx.lineTo(10, -1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10, 2); ctx.lineTo(10, 7); ctx.stroke();
      }
      ctx.restore();
    }

    /* ---------- 特效 ---------- */
    function drawEffects(dt) {
      for (var i = 0; i < S.parts.length; i++) {
        var p = S.parts[i];
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      for (var f = 0; f < S.floats.length; f++) {
        var fl = S.floats[f];
        var k = Math.min(1, fl.t / fl.dur);
        ctx.save();
        ctx.globalAlpha = 1 - Math.pow(k, 2);
        var scale = 1 + k * 0.25;
        ctx.translate(fl.x, fl.y - k * 34);
        ctx.scale(scale, scale);
        var tw = 22;
        ctx.fillStyle = COL.ink;
        rr(ctx, -tw, -13, tw * 2, 26, 13); ctx.fill();
        text(fl.text, 0, 1, 15, 'bold', '#FFF6E4', 'center');
        ctx.restore();
      }
      if (S.toastT > 0) {
        var a = Math.min(1, S.toastT / 0.4);
        ctx.save();
        ctx.globalAlpha = a;
        var tfs = 12;
        ctx.font = 'bold ' + tfs + 'px ' + FONT;
        var tw2 = ctx.measureText(S.toast).width + 26;
        while (tfs > 9 && tw2 > W - 30) {
          tfs--;
          ctx.font = 'bold ' + tfs + 'px ' + FONT;
          tw2 = ctx.measureText(S.toast).width + 26;
        }
        if (tw2 > W - 20) tw2 = W - 20;
        ctx.fillStyle = COL.ink;
        rr(ctx, W / 2 - tw2 / 2, L.hudY + L.hudH + 18, tw2, 28, 14); ctx.fill();
        text(S.toast, W / 2, L.hudY + L.hudH + 32, tfs, 'bold', '#FFF6E4', 'center');
        ctx.restore();
      }
      if (S.flash > 0) {
        ctx.save();
        ctx.globalAlpha = S.flash * 0.35;
        ctx.fillStyle = '#FFF3D6';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }

    /* ---------- 弹窗 ---------- */
    function drawModal(kind) {
      ctx.save();
      ctx.fillStyle = 'rgba(239,232,220,0.9)';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

      var w = L.modalW, x = L.modalX;
      var y = Math.max((A.safeTop || 0) + 60, H * 0.28);
      var h = kind === 'win' ? 286 : 256;
      L.modalB1.y = y + (kind === 'win' ? 172 : 142);
      L.modalB2.y = L.modalB1.y + 56;

      ctx.save();
      ctx.shadowColor = 'rgba(34,31,26,0.22)'; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 6;
      ctx.fillStyle = COL.panel; rr(ctx, x, y, w, h, 18); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; rr(ctx, x, y, w, h, 18); ctx.stroke();

      var px = x + 22, cl = x + w - 44;
      if (kind === 'win') {
        text((S.run > 1 ? '第 ' + S.run + ' 周目 · ' : '') + '第 ' + S.level + ' 关 · 清空', px, y + 34, 10, 'bold', COL.muted);
        text('桌清空了', px, y + 62, 25, 'bold', COL.ink);
        text('累计得分 ' + S.score, px, y + 96, 14, 'normal', '#4A443A');
        text('最高分 ' + S.best, px, y + 120, 13, 'normal', COL.muted);
        var winTip = S.level >= LEVEL_TOTAL
          ? (S.run > 1 ? '第 ' + S.run + ' 周目也清空了，还有更难的在后面' : '全部 ' + LEVEL_TOTAL + ' 关都清空了，第 2 周目等你')
          : (S.level < 12 ? '下一关物件更多，眼力要跟上' : '物件叠得更紧了，慢慢看');
        text(winTip, px, y + 144, 12, 'normal', COL.muted);
      } else {
        text('第 ' + S.level + ' 关 · 槽位已满', px, y + 34, 10, 'bold', COL.muted);
        text('装不下了', px, y + 62, 25, 'bold', COL.ink);
        text('这一关得分 ' + S.score, px, y + 96, 14, 'normal', '#4A443A');
        text('先清掉已经凑到两件的类型，别贪', px, y + 122, 12, 'normal', COL.muted);
      }

      var b1 = L.modalB1, b2 = L.modalB2;
      // 主按钮
      ctx.save();
      ctx.fillStyle = COL.ink; rr(ctx, b1.x, b1.y, b1.w, b1.h, 12); ctx.fill();
      ctx.restore();
      var b1Label = kind === 'win'
        ? (S.level >= LEVEL_TOTAL
            ? (S.runMax[S.run + 1] ? '进入第 ' + (S.run + 1) + ' 周目' : '回到选关')
            : '进入第 ' + (S.level + 1) + ' 关')
        : '重玩这一关';
      text(b1Label, b1.x + b1.w / 2, b1.y + b1.h / 2, 15, 'bold', '#FFF6E4', 'center');

      // 次按钮
      ctx.save();
      ctx.lineWidth = 2; ctx.strokeStyle = COL.ink;
      rr(ctx, b2.x, b2.y, b2.w, b2.h, 11); ctx.stroke();
      ctx.restore();
      text('选择关卡', b2.x + b2.w / 2, b2.y + b2.h / 2, 13, 'bold', COL.ink, 'center');
    }

    /* ---------- 选关页 ---------- */
    function homeMainLabel() {
      var pre = S.run > 1 ? '第 ' + S.run + ' 周目 · ' : '';
      if (S.maxLevel > LEVEL_TOTAL) return pre + '选择关卡';
      return pre + (S.maxLevel > 1 ? '继续第 ' + S.maxLevel + ' 关' : '开始游戏');
    }

    function drawBackBtn(r) {
      ctx.save();
      ctx.shadowColor = 'rgba(34,31,26,0.18)'; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
      ctx.fillStyle = COL.panel; rr(ctx, r.x, r.y, r.w, r.h, 10); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; rr(ctx, r.x, r.y, r.w, r.h, 10); ctx.stroke();
      ctx.save();
      ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
      ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(5, -7); ctx.lineTo(-4, 0); ctx.lineTo(5, 7); ctx.stroke();
      ctx.restore();
    }

    function drawLock(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = '#B7AD9A'; ctx.fillStyle = '#B7AD9A'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(0, -3, 3.6, Math.PI, 0); ctx.stroke();
      rr(ctx, -4.4, -3, 8.8, 7, 2); ctx.fill();
      ctx.restore();
    }

    function drawLevels() {
      ctx.fillStyle = COL.paper; ctx.fillRect(0, 0, W, H);
      drawBackBtn(L.back);
      text('选择关卡', W / 2, L.hudY + 18, 22, 'bold', COL.ink, 'center');
      drawRunNav();
      var passed = Math.min(Math.max(0, S.maxLevel - 1), LEVEL_TOTAL);
      text('已通关 ' + passed + ' / ' + LEVEL_TOTAL, W / 2, L.hudY + 62, 11, 'normal', COL.muted, 'center');

      var pulse = 0.5 + 0.5 * Math.sin(Date.now() / 380);
      var page = S.page || 0;
      for (var i = 0; i < L.cells.length; i++) {
        var c = L.cells[i], lv = c.level;
        if (c.page !== page) continue;
        var cleared = lv < S.maxLevel;
        var open = lv <= S.maxLevel;
        var challenge = (lv === S.maxLevel && S.maxLevel <= LEVEL_TOTAL);

        ctx.save();
        ctx.fillStyle = cleared ? COL.ink : (challenge ? '#FBEFD6' : COL.panel);
        rr(ctx, c.x, c.y, c.w, c.h, 9); ctx.fill();
        ctx.restore();

        if (challenge) {
          ctx.save();
          ctx.globalAlpha = 0.5 + pulse * 0.5;
          ctx.lineWidth = 2.4; ctx.strokeStyle = '#E39B2F';
          rr(ctx, c.x - 1, c.y - 1, c.w + 2, c.h + 2, 10); ctx.stroke();
          ctx.restore();
        } else if (!cleared) {
          ctx.save();
          ctx.lineWidth = 1.4; ctx.strokeStyle = COL.line; ctx.setLineDash([4, 4]);
          rr(ctx, c.x, c.y, c.w, c.h, 9); ctx.stroke();
          ctx.restore();
        }

        if (cleared) {
          text(String(lv), c.x + c.w / 2, c.y + c.h / 2, 15, 'bold', '#FFF6E4', 'center');
        } else if (open) {
          text(String(lv), c.x + c.w / 2, c.y + c.h / 2, 15, 'bold', COL.ink, 'center');
        } else {
          text(String(lv), c.x + c.w / 2, c.y + c.h / 2 - 5, 11, 'bold', '#B3A995', 'center');
          drawLock(c.x + c.w / 2, c.y + c.h / 2 + 12);
        }
      }

      // 翻页
      var hasPrev = page > 0, hasNext = page < L.lvPages - 1;
      drawPageBtn(L.pagePrev, '<', hasPrev);
      drawPageBtn(L.pageNext, '>', hasNext);
      text((page + 1) + ' / ' + L.lvPages, W / 2, L.pageInfoY, 12, 'bold', COL.ink, 'center');

      // 图例（一行小字，放在翻页按钮上方）
      var ly = L.legendY;
      var legend = [
        { t: '已通关', c: COL.ink },
        { t: '可挑战', c: '#E39B2F' },
        { t: '未解锁', c: '#C3B9A6' }
      ];
      var lx = W / 2 - 108;
      for (var g = 0; g < legend.length; g++) {
        ctx.save();
        ctx.fillStyle = legend[g].c;
        ctx.beginPath(); ctx.arc(lx + 5, ly, 3.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        text(legend[g].t, lx + 12, ly, 9, 'bold', COL.muted);
        lx += 74;
      }
    }

    // 选关页顶部的周目切换：只有解锁了多个周目才出现
    function runCount() {
      var n = 1;
      while (S.runMax && S.runMax[n + 1]) n++;
      return n;
    }

    function drawRunNav() {
      var n = runCount();
      if (n < 2) {
        if (S.run > 1) text('第 ' + S.run + ' 周目', W / 2, L.hudY + 42, 11, 'bold', COL.ink, 'center');
        return;
      }
      var hasPrev = S.run > 1, hasNext = S.run < n;
      runArrow(L.runPrev, -1, hasPrev);
      runArrow(L.runNext, 1, hasNext);
      text('第 ' + S.run + ' 周目', W / 2, L.hudY + 42, 12, 'bold', COL.ink, 'center');
    }

    function runArrow(r, dir, enabled) {
      ctx.save();
      ctx.globalAlpha = enabled ? 1 : 0.35;
      ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(r.x + r.w / 2 - dir * 5, r.y + r.h / 2 - 6);
      ctx.lineTo(r.x + r.w / 2 + dir * 5, r.y + r.h / 2);
      ctx.lineTo(r.x + r.w / 2 - dir * 5, r.y + r.h / 2 + 6);
      ctx.stroke();
      ctx.restore();
    }

    function drawPageBtn(r, arrow, enabled) {
      ctx.save();
      ctx.globalAlpha = enabled ? 1 : 0.4;
      ctx.fillStyle = COL.panel; rr(ctx, r.x, r.y, r.w, r.h, 9); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; rr(ctx, r.x, r.y, r.w, r.h, 9); ctx.stroke();
      text(arrow, r.x + r.w / 2, r.y + r.h / 2, 16, 'bold', COL.ink, 'center');
      ctx.restore();
    }

    // 切周目：进度按 runMax[run] 走
    function switchRun(run) {
      if (!S.runMax[run]) return;
      S.run = run;
      S.maxLevel = S.runMax[run] || 1;
      S.page = 0;
      persist();
    }

    // 进选关页时自动翻到有进度的这一页
    function openLevels() {
      var lv = clamp(S.maxLevel || 1, 1, LEVEL_TOTAL);
      S.page = Math.floor((lv - 1) / (L.lvPerPage || 30));
      S.screen = 'levels';
    }

    /* ---------- 首页 ---------- */
    function drawSlotPreview(cx, cy) {
      var n = 7, size = 28, gap = 6;
      var totalW = n * size + (n - 1) * gap;
      var x0 = cx - totalW / 2;
      for (var i = 0; i < n; i++) {
        var x = x0 + i * (size + gap);
        if (i < 2) {
          drawTile(x, cy - size / 2, size, 'dot', 0, false, 1, 0.9);
        } else {
          ctx.save();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = COL.line;
          ctx.setLineDash([4, 4]);
          rr(ctx, x, cy - size / 2, size, size, 8);
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    function drawHome() {
      var cx = W / 2;
      ctx.save();
      ctx.fillStyle = COL.paper; ctx.fillRect(0, 0, W, H);
      ctx.restore();

      // 顶部物件排：四种符号并排，作为封面主视觉
      var dec = ['dot', 'tri', 'dia', 'star'];
      var dsize = Math.min(50, W * 0.115);
      var dgap = dsize * 1.18;
      var dstart = cx - dgap * (dec.length - 1) / 2;
      var rowY = H * 0.145;
      for (var i = 0; i < dec.length; i++) {
        var wob = Math.sin(Date.now() / 1100 + i * 0.7) * 2;
        drawTile(dstart + i * dgap - dsize / 2, rowY + wob - dsize / 2, dsize, dec[i],
          [-13, -4, 5, 12][i], false, 1, 0.95);
      }

      text('极简超休闲', cx, H * 0.225, 11, 'bold', COL.muted, 'center');
      text('三连收纳', cx, H * 0.275, 38, 'bold', COL.ink, 'center');
      text('把一桌乱物收拾干净', cx, H * 0.322, 13, 'normal', '#5A5244', 'center');

      var lines = [
        '只能拿起没被压住的物件',
        '同款凑满 3 个自动消掉',
        '7 个槽位占满就算输',
        '卡住了就抖一抖手机'
      ];
      for (var l = 0; l < lines.length; l++) {
        var yy = H * 0.40 + l * 30;
        ctx.save();
        ctx.fillStyle = COL.ink;
        ctx.beginPath(); ctx.arc(cx - 96, yy, 8, 0, Math.PI * 2); ctx.fill();
        text(String(l + 1), cx - 96, yy + 1, 10, 'bold', '#FFF8E7', 'center');
        ctx.restore();
        text(lines[l], cx - 80, yy, 13, 'normal', '#4A443A');
      }

      // 进度
      var passed = Math.min(Math.max(0, S.maxLevel - 1), LEVEL_TOTAL);
      text('最高分 ' + S.best, cx, H * 0.572, 14, 'bold', COL.ink, 'center');
      text('已通关 ' + passed + ' / ' + LEVEL_TOTAL + ' 关', cx, H * 0.612, 12, 'normal', COL.muted, 'center');

      // 开始 / 继续按钮
      var r = L.homePlay;
      ctx.save();
      ctx.shadowColor = '#C8B79A'; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 3;
      ctx.fillStyle = COL.ink; rr(ctx, r.x, r.y, r.w, r.h, 13); ctx.fill();
      ctx.restore();
      text(homeMainLabel(), r.x + r.w / 2, r.y + r.h / 2, 17, 'bold', '#FFF6E4', 'center');

      // 选择关卡
      var lr = L.homeLevels;
      ctx.save();
      ctx.lineWidth = 2; ctx.strokeStyle = COL.ink;
      rr(ctx, lr.x, lr.y, lr.w, lr.h, 11); ctx.stroke();
      ctx.restore();
      text('选择关卡', lr.x + lr.w / 2, lr.y + lr.h / 2, 13, 'bold', COL.ink, 'center');

      // 槽位示意：两个同款 + 五个空位，直观说明目标
      drawSlotPreview(cx, L.previewY);

      drawSoundBtn(L.homeSound);
      // 分享
      var s = L.homeShare;
      ctx.save();
      ctx.shadowColor = 'rgba(34,31,26,0.18)'; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
      ctx.fillStyle = COL.panel; rr(ctx, s.x, s.y, s.w, s.h, 10); ctx.fill();
      ctx.restore();
      ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; rr(ctx, s.x, s.y, s.w, s.h, 10); ctx.stroke();
      ctx.save();
      ctx.translate(s.x + s.w / 2, s.y + s.h / 2);
      ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-8, 2); ctx.lineTo(8, -6); ctx.moveTo(-8, 2); ctx.lineTo(8, 8); ctx.stroke();
      ctx.beginPath(); ctx.arc(-9, 2, 3, 0, Math.PI * 2); ctx.arc(9, -6, 3, 0, Math.PI * 2); ctx.arc(9, 8, 3, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();

      text('三连收纳 · 可玩版本', cx, H - (A.safeBottom || 0) - 22, 10, 'normal', '#B4A994', 'center');
    }

    /* ---------- 主循环 ---------- */
    function update(dt) {
      var i;
      // 飞行
      var landed = false;
      for (i = S.flying.length - 1; i >= 0; i--) {
        var f = S.flying[i];
        f.t += dt;
        if (f.t >= f.dur) {
          var chip = null;
          for (var q = 0; q < S.slots.length; q++) {
            if (S.slots[q].id === f.slotId) { chip = S.slots[q]; break; }
          }
          if (chip && !chip.landed) { chip.landed = true; chip.born = 0; }
          landed = true;
          S.flying.splice(i, 1);
        }
      }
      // 槽位动画
      for (i = 0; i < S.slots.length; i++) {
        if (S.slots[i].landed) S.slots[i].born += dt;
        if (S.slots[i].dying > 0) S.slots[i].dying += dt;
      }
      // 粒子
      for (i = S.parts.length - 1; i >= 0; i--) {
        var p = S.parts[i];
        p.t += dt;
        p.vy += 320 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.t >= p.life) S.parts.splice(i, 1);
      }
      // 飘字
