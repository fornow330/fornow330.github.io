<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fornowAI · 你想去哪儿</title>
<style>
  :root{
    --bg:#0A1114;
    --card:#12211F;
    --ink:#E7F2EF;
    --dim:#8FA8A2;
    --mute:#5F7773;
    --teal:#35D6B4;
    --line:rgba(143,168,162,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 14px);
  }
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column}
  .tag{color:var(--teal);font-size:11px;letter-spacing:.2em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  h1{margin:8px 0 0;font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
  .sub{margin:6px 0 0;color:var(--dim);font-size:12px;line-height:1.5}

  .list{margin:14px 0 0;display:flex;flex-direction:column;gap:7px}
  .card{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:10px 14px;background:var(--card);border:1px solid transparent;border-radius:13px;
    color:inherit;text-align:left;font:inherit;cursor:pointer;
    transition:border-color .18s ease,transform .18s ease,background .18s ease;
  }
  .card:active{transform:scale(.985)}
  @media (hover:hover){.card:hover{border-color:rgba(53,214,180,.45);background:#162924}}
  .card .txt{min-width:0;flex:1}
  .card .name{font-size:15px;font-weight:600}
  .card .desc{margin-top:2px;font-size:11px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .go{flex:none;font-size:12px;color:var(--teal);white-space:nowrap}
  .card .go i{font-style:normal;display:inline-block;margin-left:2px;transition:transform .18s ease}
  .card:hover .go i{transform:translateX(3px)}

  .search{margin:12px 0 0}
  .label{color:var(--mute);font-size:11px;margin:0 0 7px}
  form{display:flex;gap:8px}
  input[type=text]{
    flex:1;min-width:0;padding:12px 13px;background:#0F191C;color:var(--ink);
    border:1px solid var(--line);border-radius:12px;font-size:14px;outline:none;
  }
  input::placeholder{color:var(--mute)}
  input:focus{border-color:rgba(53,214,180,.6)}
  button[type=submit]{
    flex:none;padding:12px 15px;border:0;border-radius:12px;
    background:var(--teal);color:#04211C;font-size:13px;font-weight:700;cursor:pointer;
  }
  button[type=submit]:disabled{opacity:.6}
  button[type=submit]:active{filter:brightness(.95)}

  .results{margin:10px 0 0;display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:46dvh}
  .res{padding:10px 12px;background:#0F191C;border:1px solid var(--line);border-radius:11px;cursor:pointer}
  .res:hover{border-color:rgba(53,214,180,.45)}
  .res .rn{font-size:13px;font-weight:600}
  .res .rn b{color:var(--teal);font-weight:600}
  .res .rd{margin-top:3px;font-size:11px;color:var(--dim);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .res .rm{margin-top:4px;font-size:10px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}

  .note{margin:auto 0 0;padding-top:12px;color:var(--mute);font-size:10.5px;line-height:1.6}
  .note b{color:var(--dim);font-weight:500}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);
    background:#162924;color:var(--ink);border:1px solid rgba(53,214,180,.4);
    padding:9px 14px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;max-width:82vw;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (max-height:640px){
    body{padding-top:calc(env(safe-area-inset-top) + 14px)}
    h1{font-size:24px}
    .list{gap:6px;margin-top:12px}
    .card{padding:9px 13px}
    .search{margin-top:11px}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="tag">fornowAI</div>
    <h1>你想去哪儿</h1>
    <p class="sub">GitHub 站点自动走 CDN 加速，失败回源。</p>

    <div class="list" id="list"></div>


    <section class="search">
      <p class="label">或者，找一个仓库</p>
      <form id="f" autocomplete="off">
        <input id="u" type="text" inputmode="search" placeholder="owner/repo、关键词，或直接贴网址" aria-label="仓库搜索">
        <button type="submit" id="sb">搜索</button>
      </form>
      <div class="results" id="results"></div>
    </section>

    <p class="note" id="note"><b>owner/repo</b> 精确查 · 关键词全站搜（按星数）· 贴网址直接开 · 走 GitHub 公开 API，未登录有频率限制</p>
  </main>
  <div class="toast" id="toast"></div>

<script>
  const SITES = [
    { name:'文字传奇',      desc:'文字放置 · 传奇冒险', url:'https://fornow330.github.io/legendword/', repo:'fornow330.github.io', path:'legendword/index.html' },
    { name:'三连收纳',      desc:'三消收纳小游戏',       url:'https://fornow330.github.io/tidy-up/',   repo:'fornow330.github.io', path:'tidy-up/index.html' },
    { name:'二合甜品小店',  desc:'合成经营 · 甜品店',   url:'https://fornow330.github.io/tycoon/',    repo:'fornow330.github.io', path:'tycoon/index.html' },
    { name:'怪潮幸存者',    desc:'割草塔防 · 无限波次', url:'https://fornow330.github.io/cutting/',   repo:'cutting', path:'index.html' },
    { name:'工具箱',        desc:'小羽工具箱',           url:'https://fornow330.github.io/xiaoyutool/',repo:'xiaoyutool', path:'index.html' },
  ];

  const IN_APP = /FornowSiteBox|fornowAI/i.test(navigator.userAgent || '');
  const list = document.getElementById('list');

  const EXTRA = [
    { name:'进入主站', desc:'联系本站长', url:'https://fornow.cc' },
  ];

  SITES.concat(EXTRA).forEach(s=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'card';
    b.innerHTML = '<span class="txt"><span class="name"></span><span class="desc"></span></span><span class="go">进入<i aria-hidden="true">›</i></span>';
    b.querySelector('.name').textContent = s.name;
    b.querySelector('.desc').textContent = s.desc;
    b.addEventListener('click', ()=>{ IN_APP ? (location.href = appUrl(s)) : go(s.url); });
    list.appendChild(b);
  });

  function appUrl(s){
    const q = new URLSearchParams();
    q.set('u', s.url);
    if(s.repo) q.set('repo', s.repo);
    if(s.path) q.set('path', s.path);
    if(s.name) q.set('name', s.name);
    return 'fornowai://open?' + q.toString();
  }


  const resultsEl = document.getElementById('results');
  const noteEl = document.getElementById('note');
  const sbEl = document.getElementById('sb');
  const toastEl = document.getElementById('toast');
  let toastTimer = 0;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toastEl.classList.remove('on'), 1800);
  }

  function looksUrl(v){
    return /^https?:\/\//i.test(v) || /^[\w.-]+\.(io|com|org|net|cn|dev|app|me|xyz|top|cc|so|sh|tv|vip|gg|to)\b/i.test((v||'').trim());
  }
  function normalize(v){
    const t = (v||'').trim();
    if(!t) return '';
    if(/^https?:\/\/[^\s]+/i.test(t)) return t;
    if(/^[^\s/]+\.[^\s]+/.test(t)) return 'https://' + t;
    return '';
  }

  function go(url){
    const u = normalize(url);
    if(!u){ toast('请输入正确的网址，例如 https://example.com'); return; }
    if(IN_APP){
      const q = new URLSearchParams(); q.set('u', u);
      location.href = 'fornowai://open?' + q.toString();
      return;
    }
    window.location.href = u;
  }

  function renderRepo(r){
    const parts = r.full_name.split('/');
    const el = document.createElement('div');
    el.className = 'res';
    el.innerHTML = '<div class="rn"><b></b>/<span class="nm"></span></div><div class="rd"></div>' +
                   '<div class="rm"><span class="st"></span><span class="lg"></span><span class="up"></span></div>';
    el.querySelector('.rn b').textContent = parts[0];
    el.querySelector('.nm').textContent = parts.slice(1).join('/');
    el.querySelector('.rd').textContent = r.description || '（无简介）';
    el.querySelector('.st').textContent = '★ ' + (r.stargazers_count ?? 0);
    el.querySelector('.lg').textContent = r.language || '—';
    el.querySelector('.up').textContent = '更新 ' + (r.pushed_at || r.updated_at || '').slice(0,10);
    el.addEventListener('click', ()=>{
      const target = r.homepage && /^https?:\/\//i.test(r.homepage) ? r.homepage : r.html_url;
      go(target);
    });
    resultsEl.appendChild(el);
  }

  async function searchRepos(q){
    resultsEl.innerHTML = '';
    sbEl.disabled = true; sbEl.textContent = '搜索中…';
    noteEl.textContent = '正在 GitHub 搜索：' + q;
    try{
      if(/^[\w.-]+\/[\w.-]+$/.test(q)){
        const res = await fetch('https://api.github.com/repos/' + q, {headers:{'Accept':'application/vnd.github+json'}});
        if(res.ok){
          const one = await res.json();
          noteEl.textContent = '精确匹配 · ' + one.full_name;
          renderRepo(one);
          return;
        }
      }
      const res = await fetch('https://api.github.com/search/repositories?q=' + encodeURIComponent(q) + '&sort=stars&order=desc&per_page=6',
        {headers:{'Accept':'application/vnd.github+json'}});
      if(!res.ok) throw new Error(res.status === 403 ? '触发频率限制，稍后再试' : 'GitHub 返回 ' + res.status);
      const data = await res.json();
      const items = data.items || [];
      if(!items.length){ noteEl.textContent = '没有找到相关仓库，换个关键词试试'; return; }
      noteEl.textContent = '共 ' + data.total_count + ' 个结果，按星数显示前 ' + items.length + ' 个';
      items.forEach(renderRepo);
    }catch(err){
      noteEl.textContent = '搜索失败：' + (err.message || err);
    }finally{
      sbEl.disabled = false; sbEl.textContent = '搜索';
    }
  }

  document.getElementById('f').addEventListener('submit', e=>{
    e.preventDefault();
    const v = document.getElementById('u').value.trim();
    if(!v){ toast('输入仓库名或网址'); return; }
    if(looksUrl(v)){ go(v); return; }
    searchRepos(v);
  });
</script>
</body>
</html>
