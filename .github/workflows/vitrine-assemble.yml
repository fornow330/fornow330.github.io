name: vitrine-assemble

on:
  push:
    paths:
      - 'vitrine/.build/**'
      - '.github/workflows/vitrine-assemble.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble index.html
        run: |
          python3 vitrine/.build/assemble.py > vitrine/.build/build.log 2>&1 || true
          cat vitrine/.build/build.log
          test -s vitrine/index.html

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vitrine/.build/build.log
          if [ -f vitrine/index.html ]; then git add -f vitrine/index.html; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "vitrine: assemble index.html from build parts"
            git push origin HEAD:main
          fi
