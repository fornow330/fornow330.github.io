name: vitrine-assemble

on:
  push:
    paths:
      - 'vitrine/.build/**'
      - '.github/workflows/vitrine-assemble.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and assemble index.html
        run: |
          set -euo pipefail
          cat vitrine/.build/part-*.b64 | base64 -d | gunzip > vitrine/index.html
          ls -l vitrine/index.html
          sha256sum vitrine/index.html

      - name: Commit assembled file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vitrine/index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "vitrine: assemble index.html from build parts"
            git push
          fi
