name: assemble-source

on:
  push:
    paths:
      - 'legendword/c*'
      - '.github/workflows/assemble.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从分片还原可读源码
        run: |
          cat legendword/c?? | base64 -d | gzip -d > legendword/game.html
          ls -l legendword/game.html
          md5sum legendword/game.html

      - name: 合入 GPL-3.0 官方许可证全文
        run: |
          curl -sfL https://www.gnu.org/licenses/gpl-3.0.txt -o /tmp/gpl.txt
          head -3 /tmp/gpl.txt
          if ! head -1 /tmp/gpl.txt | grep -q 'GNU GENERAL PUBLIC LICENSE'; then echo '许可证下载异常'; exit 1; fi
          { printf '传奇文字 (Legend Word)\nCopyright (C) 2026 fornow330\n\n'; cat /tmp/gpl.txt; } > LICENSE
          wc -c LICENSE

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legendword/game.html LICENSE
          if git diff --staged --quiet; then echo "无变化"; else git commit -m "chore: assemble source and sync GPL-3.0 license"; git push; fi
