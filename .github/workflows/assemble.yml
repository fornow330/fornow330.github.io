name: assemble-source

on:
  push:
    paths:
      - 'legendword/c*'
      - '.github/workflows/assemble.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 修正分片
        run: |
          curl -sfL --max-time 40 "https://raw.githubusercontent.com/fornow330/fornow330.github.io/1e3edd388ab52710153b02353509afb374431861/legendword/c02" -o legendword/c02
          python3 - <<'PY'
import io
p='legendword/c01'
s=open(p).read()
s=s.replace('K1aenVCOCssXnC','K1aenVCoCssXnC')
open(p,'w').write(s)
PY
          echo fixed

      - name: 从分片还原可读源码
        run: |
          rm -f legendword/game.html
          for f in c00 c01 c02 c03 c04 c05 c06 c07 c08 c09 c10 c11 c12 c12b c13; do tr -d '\n' < legendword/$f >> /tmp/all.txt; done
          base64 -d < /tmp/all.txt | gzip -d > legendword/game.html
          wc -c legendword/game.html
          md5sum legendword/game.html

      - name: 合入 GPL-3.0 官方许可证全文
        run: |
          ok=0
          for u in "https://raw.githubusercontent.com/spdx/license-list-data/v3.20/text/GPL-3.0.txt" "https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0.txt" "https://www.gnu.org/licenses/gpl-3.0.txt"
          do
            if curl -sfL --max-time 30 "$u" -o /tmp/gpl.txt && head -1 /tmp/gpl.txt | grep -q 'GNU GENERAL PUBLIC LICENSE'; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo 'license fetch failed'; exit 1; fi
          printf '传奇文字 (Legend Word)\nCopyright (C) 2026 fornow330\n\n' > LICENSE
          cat /tmp/gpl.txt >> LICENSE
          wc -c LICENSE

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legendword/game.html legendword/c01 legendword/c02 legendword/c12b LICENSE
          if git diff --staged --quiet; then echo "nochange"; else git commit -m "chore: assemble source + GPL-3.0"; git push; fi
