name: sync-source

# 触发：push SRC_URL.txt / 本文件；亦可手动 dispatch（改注释可强制触发）
on:
  push:
    paths:
      - '.github/workflows/assemble.yml'
      - 'legendword/SRC_URL.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取最新本体（地址来自 legendword/SRC_URL.txt）
        run: |
          SRC=$(head -1 legendword/SRC_URL.txt | tr -d '\r\n ')
          echo "SRC=$SRC"
          curl -sfL --max-time 90 "$SRC" -o legendword/game.html
          wc -c legendword/game.html
          md5sum legendword/game.html
          grep -q '</html>' legendword/game.html

      - name: 合入 GPL-3.0 官方许可证全文
        run: |
          ok=0
          for u in "https://raw.githubusercontent.com/spdx/license-list-data/v3.20/text/GPL-3.0.txt" "https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0.txt" "https://www.gnu.org/licenses/gpl-3.0.txt"
          do
            if curl -sfL --max-time 30 "$u" -o /tmp/gpl.txt && head -1 /tmp/gpl.txt | grep -q 'GNU GENERAL PUBLIC LICENSE'; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo 'license fetch failed'; exit 1; fi
          printf '传奇文字 (Legend Word)\nCopyright (C) 2026 fornow330\n\n' > LICENSE
          cat /tmp/gpl.txt >> LICENSE

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legendword/game.html LICENSE
          if git diff --staged --quiet; then echo "nochange"; else git commit -m "chore: sync source + GPL-3.0"; git push; fi
