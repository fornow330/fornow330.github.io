name: sync-source
# game.html 由本地 git push 直推；本工作流只刷新 GPL-3.0 许可证。
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 合入 GPL-3.0
        run: |
          ok=0
          for u in "https://raw.githubusercontent.com/spdx/license-list-data/v3.20/text/GPL-3.0.txt" "https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0.txt" "https://www.gnu.org/licenses/gpl-3.0.txt"
          do
            if curl -sfL --max-time 30 "$u" -o /tmp/gpl.txt && head -1 /tmp/gpl.txt | grep -q 'GNU GENERAL PUBLIC LICENSE'; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo 'license fetch failed'; exit 1; fi
          printf '传奇文字 (Legend Word)\nCopyright (C) 2026 fornow330\n\n' > legendword/LICENSE
          cat /tmp/gpl.txt >> legendword/LICENSE
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legendword/LICENSE
          if git diff --staged --quiet; then echo "nochange"; else git commit -m "chore: GPL-3.0 licence"; git push; fi
