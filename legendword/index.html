<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>传奇文字</title>
<style>html,body{margin:0;padding:0;height:100%;background:#08080c;color:#9a968c;font:13px/1.7 -apple-system,sans-serif;overflow:hidden}#tip{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}#tip a{color:#e0b34a;margin-top:10px}</style>
</head>
<body>
<div id="tip">正在加载传奇文字…</div>
<script>
var BUILD = 'cc01c6b639394f1727768721d4574546fd7a749f';
var FILE = 'game.html';
var RAW = 'https://raw.githubusercontent.com/fornow330/fornow330.github.io/' + BUILD + '/legendword/';
var BASES = [
  'https://fastly.jsdelivr.net/gh/fornow330/fornow330.github.io@' + BUILD + '/legendword/',
  'https://ghproxy.net/' + RAW,
  'https://gh-proxy.com/' + RAW,
  'https://ghfast.top/' + RAW,
  './'
];
var PAGE = 'https://fornow330.github.io/legendword/';
function showTip(msg, url){
  var t = document.getElementById('tip');
  if(!t) return;
  t.innerHTML = msg + (url ? ('<a href="' + url + '">点此进入在线版</a>') : '');
}
function write(html){ document.open(); document.write(html); document.close(); }
async function loadFrom(base){
  var r = await fetch(base + FILE + '?v=' + BUILD.slice(0,8), {cache: 'force-cache'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  var html = await r.text();
  if (!html || html.length < 10000) throw new Error('内容不完整');
  return html;
}
(async function(){
  var lastErr = '';
  for (var i = 0; i < BASES.length; i++) {
    try{ write(await loadFrom(BASES[i])); return; }
    catch(e){ lastErr = String(e && e.message ? e.message : e); }
  }
  showTip('加载失败：' + lastErr + '，请检查网络', PAGE);
})();
</script>
</body>
</html>
